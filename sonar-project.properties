# SonarQube Cloud (issue #24, MC-E3). Organización y proyecto creados por el equipo; el token va en el
# secreto SONAR_TOKEN de GitHub, nunca aquí.
sonar.organization=juanjo0775
sonar.projectKey=JuanJo0775_Sistema_valora_B
sonar.projectName=Sistema_valora_B
sonar.sourceEncoding=UTF-8

# SonarQube analiza todo el repositorio: se dejan fuera los archivos que no son código.
# Los archivos de prueba no cuentan como líneas de código del plan gratuito (tope de 50 000 líneas por
# organización, que el servidor y el frontend juntos pasaban): se marcan como pruebas y quedan fuera del
# código fuente principal. Los dos conjuntos son disjuntos (SonarQube no admite un archivo en ambos).
sonar.exclusions=docs/**,drizzle/**,seed/**,coverage/**,**/*.png,**/*.svg,**/*.xlsx,**/*.spec.ts,test/**
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,test/**

# Cobertura que genera Jest en el job Pruebas. Las pruebas no cuentan como código por cubrir, ni lo
# que Jest deja fuera (jest.config.cjs).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# src/seed-mirror-images.ts es cableado de arranque, como src/main.ts: solo arma Nest y llama al caso de uso
# MirrorProductImages, que sí tiene pruebas. Se excluye de la cobertura por eso.
sonar.coverage.exclusions=**/*.spec.ts,test/**,src/main.ts,src/seed-mirror-images.ts,src/**/*.module.ts,*.cjs,*.config.ts

# Hallazgos revisados por el equipo (#24, MC-E3). Cada exclusión dice por qué.
# typescript:S4790 en stable-id.ts: SHA-1 es obligatorio para los UUID versión 5 (RFC 9562); solo genera
# ids fijos para la semilla y no protege ningún dato secreto.
sonar.issue.ignore.multicriteria=uuid5
sonar.issue.ignore.multicriteria.uuid5.ruleKey=typescript:S4790
sonar.issue.ignore.multicriteria.uuid5.resourceKey=src/modules/imports/application/stable-id.ts
