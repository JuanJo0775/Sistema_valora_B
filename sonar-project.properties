# SonarQube Cloud (issue #24, MC-E3). Organización y proyecto creados por el equipo; el token va en el
# secreto SONAR_TOKEN de GitHub, nunca aquí.
sonar.organization=juanjo0775
sonar.projectKey=JuanJo0775_Sistema_valora_B
sonar.projectName=Sistema_valora_B

# Código y pruebas
sonar.sources=src
sonar.exclusions=**/*.spec.ts
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,test/**/*.ts

# Cobertura que genera Jest en el job Pruebas
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Lo mismo que Jest deja fuera de la cobertura (jest.config.cjs)
sonar.coverage.exclusions=src/main.ts,src/**/*.module.ts
