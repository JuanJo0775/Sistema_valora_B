# SonarQube Cloud (issue #24, MC-E3). Organización y proyecto creados por el equipo; el token va en el
# secreto SONAR_TOKEN de GitHub, nunca aquí.
sonar.organization=juanjo0775
sonar.projectKey=JuanJo0775_Sistema_valora_B
sonar.projectName=Sistema_valora_B
sonar.sourceEncoding=UTF-8

# SonarQube analiza todo el repositorio: se dejan fuera los archivos que no son código.
sonar.exclusions=docs/**,drizzle/**,seed/**,coverage/**,**/*.png,**/*.svg,**/*.xlsx

# Cobertura que genera Jest en el job Pruebas. Las pruebas no cuentan como código por cubrir, ni lo
# que Jest deja fuera (jest.config.cjs).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,test/**,src/main.ts,src/**/*.module.ts,*.cjs,*.config.ts
