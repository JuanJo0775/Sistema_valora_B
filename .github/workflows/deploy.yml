name: Despliegue

# ADR-012: Render construye la imagen del Dockerfile y Neon guarda la base. Render no despliega solo
# (autoDeployTrigger: off en render.yaml): este pipeline aplica las migraciones y luego lo dispara.
on:
  workflow_dispatch:
    inputs:
      cargar_semilla:
        description: Cargar la semilla de seed/ en Neon después de migrar (tiendas, productos y SIPSA verificados)
        type: boolean
        default: false
      copiar_fotos:
        description: Copiar al bucket de Supabase las fotos de la semilla que siguen en Open Food Facts (después de la semilla)
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

# Un despliegue a la vez; uno nuevo no cancela al que está aplicando migraciones.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    name: Migrar y desplegar
    runs-on: ubuntu-latest
    # 30 minutos es la meta de RNF-009: migrar, construir en Render, verificar la versión y la prueba de humo.
    timeout-minutes: 30
    # Entorno con aprobación manual: se configura en Settings > Environments (docs/despliegue.md).
    environment: produccion
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Las migraciones van antes que el código nuevo. Deben ser compatibles hacia atrás: mientras
      # Render construye, la versión anterior sigue atendiendo contra el esquema ya migrado.
      - name: Aplicar migraciones en Neon
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

      # La semilla (issue #51) es idempotente: actualiza por id fijo, no duplica y nunca borra.
      # Arranca la aplicación Nest, que valida todas las variables; los secretos de sesión no se usan
      # aquí: se generan al azar en el momento y no se parecen a los de producción.
      - name: Cargar la semilla en Neon (opcional)
        if: ${{ inputs.cargar_semilla }}
        run: |
          export SESSION_SECRET="$(openssl rand -hex 16)" REPORTER_KEY_SECRET="$(openssl rand -hex 16)"
          pnpm build && node dist/seed.js
        env:
          NODE_ENV: production
          PORT: '3000'
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DATABASE_URL_TEST: ${{ secrets.NEON_DATABASE_URL }}
          OUTBOX_POLL_INTERVAL_MS: '5000'
          OUTBOX_MAX_ATTEMPTS: '5'
          MEDIA_DIR: media
          MEDIA_PUBLIC_URL: http://localhost/media
          # ADR-029: estos comandos arrancan Nest con NODE_ENV=production; sin proveedor de correo la
          # validación del entorno exige apagar la verificación (igual que en render.yaml). No envían correos.
          REQUIRE_VERIFIED_EMAIL: 'false'

      # ADR-022: copia las fotos externas (Open Food Facts) al bucket público de Supabase. Es
      # idempotente; si una foto falla conserva su URL original. Necesita SUPABASE_URL (variable) y
      # SUPABASE_SECRET_KEY (secreto) en el entorno produccion (docs/despliegue.md, paso 3 bis).
      - name: Copiar las fotos de la semilla a Supabase (opcional)
        if: ${{ inputs.copiar_fotos }}
        run: |
          export SESSION_SECRET="$(openssl rand -hex 16)" REPORTER_KEY_SECRET="$(openssl rand -hex 16)"
          pnpm build && node dist/seed-mirror-images.js
        env:
          NODE_ENV: production
          PORT: '3000'
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DATABASE_URL_TEST: ${{ secrets.NEON_DATABASE_URL }}
          OUTBOX_POLL_INTERVAL_MS: '5000'
          OUTBOX_MAX_ATTEMPTS: '5'
          MEDIA_DIR: media
          MEDIA_PUBLIC_URL: http://localhost/media
          # ADR-029: estos comandos arrancan Nest con NODE_ENV=production; sin proveedor de correo la
          # validación del entorno exige apagar la verificación (igual que en render.yaml). No envían correos.
          REQUIRE_VERIFIED_EMAIL: 'false'
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: Disparar el despliegue en Render
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      # En el plan gratuito Render puede tardar cerca de un minuto en despertar y construir.
      - name: Esperar a que la API responda
        run: |
          for intento in $(seq 1 30); do
            if curl --fail --silent --max-time 20 "$API_URL/v1/health" > /dev/null; then
              echo "La API responde (intento $intento)."
              exit 0
            fi
            sleep 20
          done
          echo "La API no respondió en 10 minutos." >&2
          exit 1
        env:
          API_URL: ${{ vars.API_URL }}

      # El paso anterior se cumple apenas responde la versión ANTERIOR: Render sigue construyendo la
      # imagen nueva unos minutos. /v1/health informa el commit que sirve (#23); se espera a ver el de
      # esta ejecución para saber que el código nuevo ya está activo.
      - name: Esperar a que Render sirva esta versión
        run: |
          esperado="${GITHUB_SHA::7}"
          for intento in $(seq 1 40); do
            actual=$(curl --silent --max-time 20 "$API_URL/v1/health" | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p')
            if [ "$actual" = "$esperado" ]; then
              echo "Render sirve la versión $actual (intento $intento)."
              exit 0
            fi
            echo "Intento $intento: Render sirve ${actual:-una versión que no informa su commit}, se espera $esperado."
            sleep 20
          done
          echo "Render no sirvió la versión $esperado en unos 14 minutos. Revisa el despliegue en Render y que RENDER_GIT_COMMIT exista." >&2
          exit 1
        env:
          API_URL: ${{ vars.API_URL }}

      # Prueba de humo de solo lectura (#23): solo GET, sin cuenta y sin escribir nada, por la dirección de
      # Render y por la pública (Vercel). Si falla, el despliegue ya ocurrió: la ejecución queda en rojo
      # para que alguien decida si hace la reversa (docs/despliegue.md).
      - name: Prueba de humo de solo lectura
        run: |
          fallos=0
          comprobar() {
            # $1 = dirección base, $2 = ruta, $3 = estado esperado, $4 = texto que debe traer (opcional)
            cuerpo=$(mktemp)
            estado=$(curl --silent --max-time 30 --output "$cuerpo" --write-out '%{http_code}' "$1$2" || true)
            if [ "$estado" != "$3" ]; then
              echo "FALLA $1$2: estado $estado, se esperaba $3" >&2
              fallos=$((fallos + 1))
            elif [ -n "${4:-}" ] && ! grep -q "$4" "$cuerpo"; then
              echo "FALLA $1$2: la respuesta no trae $4" >&2
              fallos=$((fallos + 1))
            else
              echo "OK $1$2 ($estado)"
            fi
            rm -f "$cuerpo"
          }
          for base in "$API_URL" "$PUBLIC_URL"; do
            comprobar "$base" /v1/health 200 '"status":"ok"'
            comprobar "$base" /v1/categories 200 '"items"'
            comprobar "$base" '/v1/establishments/nearby?lat=4.5339&lng=-75.6811' 200 '"items"'
            comprobar "$base" /v1/auth/session 401 '"code"'
          done
          if [ "$fallos" -ne 0 ]; then
            echo "La prueba de humo encontró $fallos fallas." >&2
            exit 1
          fi
          echo "Prueba de humo correcta."
        env:
          API_URL: ${{ vars.API_URL }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://www.valoora.app' }}
