name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Reglas de dependencia
        run: pnpm depcheck

      - name: Compilar
        run: pnpm build

  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Base de pruebas con PostGIS (ADR-003); la CI sí puede usar contenedores (aclaración de ADR-012).
    services:
      postgres:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_USER: valora
          POSTGRES_PASSWORD: valora
          POSTGRES_DB: valora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valora -d valora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://valora:valora@localhost:5432/valora_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Todas las pruebas con cobertura
        run: pnpm test:cov --ci
