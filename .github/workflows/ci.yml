name: CI

on:
  pull_request:
    branches: [dev, main]
  # Issue #24: SonarQube necesita analizar dev y main para comparar cada pull request.
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Reglas de dependencia
        run: pnpm depcheck

      - name: Compilar
        run: pnpm build

  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Base de pruebas con PostGIS (ADR-003); la CI sí puede usar contenedores (aclaración de ADR-012).
    services:
      postgres:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_USER: valora
          POSTGRES_PASSWORD: valora
          POSTGRES_DB: valora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valora -d valora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://valora:valora@localhost:5432/valora_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Todas las pruebas con cobertura
        run: pnpm test:cov --ci

      # Issue #24: la cobertura pasa al job SonarQube.
      - name: Guardar la cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/lcov.info
          retention-days: 7

  sonarqube:
    name: SonarQube
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Historia completa: SonarQube la usa para saber qué código es nuevo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Traer la cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: coverage

      # Configuración en sonar-project.properties. Espera la regla de calidad: si no se cumple, el job
      # falla y el pull request no se puede mezclar cuando la verificación sea obligatoria.
      - name: Análisis de SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
