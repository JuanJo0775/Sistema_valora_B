openapi: 3.1.0
info:
  title: Valora API
  version: 0.1.0-preliminar
  summary: Contrato preliminar del núcleo de Valora (corte 1). Sujeto a revisión del equipo.
  description: |
    API REST de la plataforma colaborativa de comparación de precios Valora (ADR-002).
    Dos superficies: consumidor/reportante y moderación. La superficie de comercios
    (corte 3) se lista al final con el prefijo /v1/commerce y la marca x-corte: 3.
    Las respuestas públicas nunca incluyen correo, ubicación ni identificador del reportante (ADR-013).

    Ancho de banda (ADR-031): con Accept-Encoding, las respuestas de más de 1 kB salen comprimidas con
    gzip o brotli (Content-Encoding y Vary: Accept-Encoding). Las lecturas públicas sin ubicación
    llevan Cache-Control con s-maxage para la caché compartida del CDN (60 s como máximo si traen
    precios); las que llevan ubicación o sesión, las de reportes y moderación, y todos los errores
    responden no-store.
servers:
  - url: https://api.valora.example/v1
    description: Servidor de ejemplo; el proveedor se define en ADR-012.
tags:
  - name: Catálogo
  - name: Establecimientos
  - name: Comparación
  - name: Reportes
  - name: Autenticación
  - name: Moderación
  - name: Comercios
  - name: Operación
security: []
paths:
  /health:
    get:
      tags: [Operación]
      operationId: getHealth
      summary: La API está en marcha
      description: >-
        Pública y sin cuenta. Sirve para comprobar que el proceso responde (despliegue y monitoreo,
        RNF-011). No revisa la base de datos (#25).
      responses:
        '200':
          description: La API responde
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /products:
    get:
      tags: [Catálogo]
      operationId: searchProducts
      summary: Buscar productos por texto o código de barras (RF-003)
      description: >-
        Se envía exactamente uno de q o barcode; sin ninguno o con los dos responde 400 VALIDATION_ERROR
        («Envía q o barcode» o «Envía solo q o barcode, no ambos»). Con q, cada palabra debe aparecer en
        el nombre, en la marca o en los alias del producto (#26), en cualquier orden y también como pedazo («gira» encuentra «girasol»), sin
        distinguir tildes ni mayúsculas (RF-003 RN4); los resultados se ordenan por parecido con lo escrito
        y, en empate, por nombre. Con barcode responde el producto que tiene esa presentación o la lista
        vacía (no 404). Caché pública de 30 segundos (valor inicial calibrable, EC-04).
      parameters:
        - name: q
          in: query
          description: Texto libre; cada palabra debe aparecer en el nombre, la marca o un alias, sin distinguir tildes.
          schema: { type: string, minLength: 2 }
        - name: barcode
          in: query
          description: Código de barras leído del empaque (EAN/GTIN).
          schema: { type: string, pattern: '^[0-9]{8,14}$' }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Productos encontrados, del más parecido al menos parecido
          headers:
            Cache-Control:
              description: Caché del navegador 30 s; caché compartida (CDN) 60 s (ADR-031).
              schema: { type: string, example: 'public, max-age=30, s-maxage=60, stale-while-revalidate=60' }
            Vary:
              description: Accept-Encoding; la respuesta se comprime con gzip o brotli si pesa más de 1 kB (ADR-031).
              schema: { type: string, example: Accept-Encoding }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /categories:
    get:
      tags: [Catálogo]
      operationId: listCategories
      summary: Listar las categorías del catálogo (RF-003)
      description: >-
        La lista cerrada de categorías (grill de la #49), ordenada por nombre. El frontend la usa para
        proponer un producto (`categoryCode` de `POST /v1/product-requests`, #111). Solo cambia con una
        migración: caché pública de una hora (EC-04).
      responses:
        '200':
          description: Todas las categorías, por nombre
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=3600, s-maxage=3600, stale-while-revalidate=86400' }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
  /products/{productId}:
    get:
      tags: [Catálogo]
      operationId: getProduct
      summary: Consultar un producto y sus presentaciones (RF-003, RF-004)
      description: >-
        Lectura pública con caché de 5 minutos (valor inicial calibrable, EC-04) y ETag: una petición con
        If-None-Match igual al ETag responde 304 si el producto no cambió.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Producto con su categoría y sus presentaciones
          headers:
            Cache-Control:
              description: Caché compartida de 5 minutos (ADR-031).
              schema: { type: string, example: 'public, max-age=300, s-maxage=300, stale-while-revalidate=600' }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '304': { description: El producto no cambió desde el ETag enviado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{productId}/comparison:
    get:
      tags: [Comparación]
      operationId: compareProduct
      summary: Comparar precios de un producto entre establecimientos (RF-008, RF-009, RF-010)
      description: >-
        Lee el modelo precalculado price_current (ADR-004). La vigencia se calcula al leer. El orden
        depende solo de los criterios declarados; las promociones vienen aparte (ADR-009, EC-06).
        La ubicación aproximada del usuario (lat, lng) se usa solo para calcular la cercanía: no se
        guarda, no se registra en los logs ni aparece en la respuesta (RF-005 RN5, EC-08). Por eso la
        respuesta lleva Cache-Control no-store, aunque es una lectura pública. Se envía la ubicación
        (lat y lng), un municipio, o las dos cosas (RF-009 RN5, #106). Sin ubicación no hay distancia:
        distanceM no sale, radiusKm no se usa y sort=distance responde 400.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: lat
          in: query
          description: Obligatoria (con lng) si no se envía municipality.
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          description: Obligatoria (con lat) si no se envía municipality.
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: municipality
          in: query
          description: Solo las tiendas de ese municipio del Quindío (#106).
          schema: { $ref: '#/components/schemas/Municipality' }
        - name: radiusKm
          in: query
          description: Radio de búsqueda en kilómetros (valores iniciales calibrables, ADR-019).
          schema: { type: number, minimum: 0.5, maximum: 3, default: 2 }
        - name: sort
          in: query
          description: >-
            Criterio de orden. Si hay empate, unit_price sigue con la distancia y la fecha más
            reciente; distance, con el precio por unidad y la fecha; recent, con el precio por unidad
            y la distancia. Al final deciden el id del establecimiento y el de la presentación,
            comparados carácter por carácter. El precio por unidad se compara con su valor exacto.
          schema: { type: string, enum: [unit_price, distance, recent], default: unit_price }
        - name: onlyCurrent
          in: query
          description: >-
            Si es verdadero, solo incluye precios vigentes (excluye los por confirmar y los
            desactualizados).
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Resultados y promociones separadas
          headers:
            Cache-Control:
              description: >-
                no-store si la URL lleva lat o lng; con solo el municipio, caché compartida de 60 s como
                máximo (ADR-031) y ETag.
              schema: { type: string, example: 'public, max-age=30, s-maxage=60, stale-while-revalidate=30' }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comparison' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >-
            Regla de negocio incumplida. code INCOMPATIBLE_UNITS: las presentaciones del producto
            mezclan bases de unidad (100 g, 100 ml o unidad) y no se pueden comparar; el catálogo lo
            impide desde la issue #59.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /products/{productId}/history:
    get:
      tags: [Comparación]
      operationId: getPriceHistory
      summary: Historial de precios de los últimos 30 días (RF-008)
      description: >-
        Pública, sin cuenta (RN3). Una serie por presentación con el precio mínimo, el promedio
        (redondeado al peso) y la cantidad de reportes de cada día, en hora de Colombia. Los días sin
        precios no salen. No cuentan los precios descartados por moderación ni los sospechosos que
        nadie ha aprobado. Sin datos de quién reportó (EC-08). Caché pública de 5 minutos con ETag
        (EC-04) (#83).
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: establishmentId
          in: query
          description: Opcional; solo los precios de esa tienda.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Serie diaria por presentación
          headers:
            Cache-Control:
              description: Caché del navegador 5 minutos; caché compartida 60 s, porque trae precios (ADR-031).
              schema: { type: string, example: 'public, max-age=300, s-maxage=60, stale-while-revalidate=60' }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [from, to, presentations]
                properties:
                  from: { type: string, format: date, description: Primer día de la ventana (hora de Colombia). }
                  to: { type: string, format: date, description: Hoy, en hora de Colombia. }
                  presentations:
                    type: array
                    items:
                      type: object
                      required: [presentationId, label, points]
                      properties:
                        presentationId: { type: string, format: uuid }
                        label: { type: string }
                        points:
                          type: array
                          items:
                            type: object
                            required: [date, minPriceCop, avgPriceCop, reports, source]
                            properties:
                              date: { type: string, format: date }
                              minPriceCop: { type: integer, minimum: 1 }
                              avgPriceCop: { type: integer, minimum: 1 }
                              reports: { type: integer, minimum: 1 }
                              source:
                                type: string
                                enum: [reportado]
                                description: RN1; los precios oficiales llegan con commerce (Corte 3).
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: El producto no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /featured-products:
    get:
      tags: [Comparación]
      operationId: listFeaturedProducts
      summary: Canasta básica de hoy cerca de ti o en un municipio (RF-008, RF-009, B#120, B#128)
      description: >-
        Pública, sin cuenta. Los productos con más tiendas del área que tienen un precio vigente, cada
        uno con su precio más bajo por unidad y la tienda donde está. El área es un municipio, la
        ubicación del usuario con un radio, o las dos cosas, como en la comparación (#106, B#128). Lee
        price_current (ADR-004) con el mismo criterio que la comparación con onlyCurrent=true: solo
        precios vigentes (ni por confirmar, ni desactualizados, ni en revisión). El más bajo y el más
        caro se eligen con el valor exacto del precio por unidad y los desempates de la comparación. Las
        promociones no entran (ADR-009) y no hay datos de quién reportó (EC-08). Orden declarado en
        criteria (EC-06): más tiendas con precio vigente primero; en empate, el menor precio por unidad
        que se muestra (entre productos de bases distintas, 100 g o unidad, es solo un desempate) y al
        final el id del producto. Con la ubicación, la respuesta lleva Cache-Control no-store: la
        ubicación se usa solo para elegir las tiendas del radio, no se guarda, no se registra en los
        logs ni aparece en la respuesta (RF-005 RN5, EC-08). Sin ubicación, caché pública de 60 segundos
        (valor provisional, EC-04) y ETag: con If-None-Match igual al ETag responde 304. La ruta no
        cuelga de /products porque /products/{productId} tomaría «featured» como un id.
      parameters:
        - name: municipality
          in: query
          description: Obligatorio si no se envían lat y lng. Con la ubicación, el radio solo mira ese municipio.
          schema: { $ref: '#/components/schemas/Municipality' }
        - name: lat
          in: query
          description: Obligatoria (con lng) si no se envía municipality.
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          description: Obligatoria (con lat) si no se envía municipality.
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radiusKm
          in: query
          description: >-
            Radio en kilómetros alrededor de la ubicación, con los mismos límites que la comparación
            (ADR-019). Sin ubicación no se usa.
          schema: { type: number, minimum: 0.5, maximum: 3, default: 1.5 }
        - name: category
          in: query
          description: >-
            Código de la lista cerrada de categorías (GET /v1/categories). Solo los productos de esa
            categoría; un código que no existe responde la lista vacía.
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          description: Tamaño de la página. Los mismos valores del parámetro común Limit, con 5 por defecto.
          schema: { type: integer, minimum: 1, maximum: 50, default: 5 }
        - name: offset
          in: query
          description: >-
            Cuántos productos del orden se saltan (paginación por desplazamiento). Con 0 por defecto, la
            respuesta es la de siempre. Más allá del final responde 200 con items vacío. Un valor negativo
            o que no es entero responde 400 VALIDATION_ERROR.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Los productos de la canasta, en el orden declarado
          headers:
            Cache-Control:
              description: Sin ubicación, caché compartida de 60 s (ADR-031); no-store con ubicación.
              schema: { type: string, example: 'public, max-age=30, s-maxage=60, stale-while-revalidate=30' }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [criteria, storesWithPrices, total, hasMore, items]
                properties:
                  total:
                    type: integer
                    minimum: 0
                    description: >-
                      Productos destacables con los mismos filtros (municipio o ubicación, radio y
                      categoría), sumando todas las páginas.
                  hasMore:
                    type: boolean
                    description: Si quedan productos después de esta página (offset + items.length < total).
                  criteria:
                    type: object
                    description: >-
                      Criterio y área declarados al usuario (EC-06). municipality sale si se filtró por
                      municipio; radiusKm, si se envió la ubicación; category, si se filtró por categoría.
                    required: [sort]
                    properties:
                      municipality: { $ref: '#/components/schemas/Municipality' }
                      radiusKm: { type: number }
                      category: { type: string }
                      sort:
                        type: string
                        enum: [store_count]
                        description: Más tiendas con precio vigente primero.
                  storesWithPrices:
                    type: integer
                    minimum: 0
                    description: >-
                      Tiendas del área (municipio o radio) con al menos un precio vigente, de cualquier
                      categoría. Para «Precios de 7 tiendas a menos de 1,5 km».
                  items:
                    type: array
                    description: Vacío si ninguna tienda del área tiene precios vigentes.
                    items:
                      type: object
                      required: [productId, name, category, storeCount, cheapest]
                      properties:
                        productId: { type: string, format: uuid }
                        name: { type: string }
                        brand: { type: string, description: Opcional, como en Product. }
                        category: { $ref: '#/components/schemas/Category' }
                        image:
                          description: >-
                            Opcional, como en Product: la foto con su fuente y su atribución. Sin image,
                            el frontend muestra la ilustración genérica.
                          allOf: [{ $ref: '#/components/schemas/ProductImage' }]
                        storeCount:
                          type: integer
                          minimum: 1
                          description: Tiendas del área con al menos un precio vigente del producto.
                        cheapest:
                          description: El precio vigente más bajo por unidad del producto en el área.
                          allOf: [{ $ref: '#/components/schemas/FeaturedPrice' }]
                        priciest:
                          description: >-
                            El precio vigente más alto por unidad del producto en el área. Sale junto con
                            savingsPercent, solo cuando hay dos tiendas o más.
                          allOf: [{ $ref: '#/components/schemas/FeaturedPrice' }]
                        savingsPercent:
                          type: integer
                          minimum: 0
                          maximum: 100
                          description: >-
                            Cuánto menos cuesta el más barato que el más caro, por precio por unidad:
                            (más caro − más barato) / más caro × 100, con los valores exactos y redondeado
                            al entero con la mitad hacia arriba (B#128, EC-06). Solo con dos tiendas o más.
        '400': { $ref: '#/components/responses/BadRequest' }
  /establishments:
    get:
      tags: [Establecimientos]
      operationId: searchEstablishments
      summary: Buscar tiendas por nombre o municipio, sin ubicación (RF-005, #116)
      description: >-
        Para elegir la tienda sin compartir la ubicación (EC-08), por ejemplo al registrar un precio (RF-006).
        Se envía al menos uno de q o municipality; sin ninguno responde 400 VALIDATION_ERROR («Envía q o
        municipality»), para no devolver todo el directorio. Con q, cada palabra debe aparecer en el nombre
        de la tienda, en cualquier orden y también como pedazo, sin distinguir tildes ni mayúsculas (como la
        búsqueda de productos). Ordenadas por nombre. Sin ubicación no hay distancia: los items no traen
        distanceM. Cada tienda dice cuántos precios vigentes tiene (priceCount, B#131). Caché pública de
        5 minutos (valor inicial calibrable, EC-04).
      parameters:
        - name: q
          in: query
          description: Parte del nombre de la tienda; cada palabra debe aparecer, sin distinguir tildes.
          schema: { type: string, minLength: 2 }
        - name: municipality
          in: query
          description: Solo las tiendas de ese municipio del Quindío.
          schema: { $ref: '#/components/schemas/Municipality' }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tiendas encontradas, ordenadas por nombre
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=300, s-maxage=300, stale-while-revalidate=600' }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EstablishmentWithPrices' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /establishments/nearby:
    get:
      tags: [Establecimientos]
      operationId: listNearbyEstablishments
      summary: Establecimientos cercanos (RF-005)
      description: >-
        La ubicación aproximada del usuario (lat, lng) se usa solo para calcular la cercanía: no se guarda,
        no se registra en los logs ni aparece en la respuesta (RF-005 RN5, EC-08). Por eso la respuesta
        lleva Cache-Control no-store, aunque es una lectura pública. Devuelve las tiendas registradas
        dentro del radio, de la más cercana a la más lejana, cada una con cuántos precios vigentes tiene
        (priceCount, B#131).
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radiusKm
          in: query
          description: Radio de búsqueda en kilómetros (valores iniciales calibrables, ADR-019).
          schema: { type: number, minimum: 0.5, maximum: 3, default: 2 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Establecimientos ordenados por distancia
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EstablishmentWithPrices' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /establishments/{establishmentId}/prices:
    get:
      tags: [Comparación]
      operationId: listEstablishmentPrices
      summary: Precios vigentes de un establecimiento (RF-008)
      description: >-
        Pública, sin cuenta. Todos los precios de la tienda leídos de price_current, ordenados por
        producto y presentación, cada uno con su vigencia y su confiabilidad, como en la comparación
        (sin la distancia). onlyCurrent=true quita los desactualizados y los que están en revisión.
        Lectura pública con caché de 60 segundos (valor provisional, EC-04) y ETag: con If-None-Match
        igual al ETag responde 304 (#28).
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: onlyCurrent
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: La tienda y sus precios
          headers:
            Cache-Control:
              description: Caché compartida de 60 s como máximo, porque trae precios (ADR-031).
              schema: { type: string, example: 'public, max-age=30, s-maxage=60, stale-while-revalidate=30' }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [establishment, prices]
                properties:
                  establishment:
                    type: object
                    required: [id, name, type, lat, lng, municipality]
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      type: { type: string, enum: [barrio, minimercado, supermercado, descuento] }
                      address: { type: string }
                      neighborhood: { type: string, description: Opcional; barrio de la tienda (H-06). }
                      lat: { type: number }
                      lng: { type: number }
                      municipality: { $ref: '#/components/schemas/Municipality' }
                      openingHours: { $ref: '#/components/schemas/OpeningHours' }
                      phone:
                        type: string
                        description: >-
                          Teléfono de la tienda, si lo puso el comercio (#207). Dato del negocio, no
                          de una persona (EC-08).
                  prices:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          productId,
                          presentationId,
                          productName,
                          priceCop,
                          unitPrice,
                          source,
                          freshness,
                          observedAt,
                        ]
                      properties:
                        productId: { type: string, format: uuid }
                        presentationId: { type: string, format: uuid }
                        productName:
                          type: string
                          description: 'Producto y presentación, por ejemplo «Arroz Diana · 500 g».'
                        reportId:
                          type: string
                          format: uuid
                          description: El reporte cuyo precio se muestra (RF-013). Se omite para un oficial (#218).
                        priceCop: { type: integer, minimum: 1 }
                        unitPrice:
                          type: object
                          required: [valueCop, per]
                          properties:
                            valueCop: { type: integer, minimum: 0 }
                            per: { type: string, enum: [100g, 100ml, und] }
                        source: { type: string, enum: [comunidad, oficial, siembra] }
                        freshness: { type: string, enum: [vigente, por_confirmar, desactualizado] }
                        reliability: { type: string, enum: [alta, media, baja, en_revision], description: Se omite para un oficial. }
                        confirmations: { type: integer, minimum: 0, description: Se omite para un oficial. }
                        observedAt: { type: string, format: date-time }
                        discrepancy: { $ref: '#/components/schemas/PriceDiscrepancy' }
        '304': { description: Los precios no cambiaron desde el ETag enviado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: El establecimiento no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /establishment-proposals:
    post:
      tags: [Establecimientos]
      operationId: proposeEstablishment
      summary: Proponer una tienda nueva (RF-005)
      description: >-
        Solo el rol reportante. La propuesta queda pendiente y no aparece en el mapa hasta que un
        moderador la aprueba (RN7). Se guarda la clave seudónima de quien propone, nunca su cuenta;
        la ubicación es la de la tienda, no la de quien propone (RN4, EC-08) (#27).
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, lat, lng, municipality]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                type: { type: string, enum: [barrio, minimercado, supermercado, descuento] }
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                address: { type: string, maxLength: 200 }
                municipality: { $ref: '#/components/schemas/Municipality' }
      responses:
        '202':
          description: Propuesta recibida, pendiente de moderación
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [pendiente] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports:
    post:
      tags: [Reportes]
      operationId: createReport
      summary: Registrar el precio observado en un establecimiento (RF-006, RF-007)
      description: |
        Idempotente por la cabecera Idempotency-Key: un reintento con la misma clave y el mismo cuerpo
        devuelve la respuesta original y no crea duplicados (EC-01, EC-07). El precio vigente se
        actualiza segundos después con el evento PriceReported; la confianza se calcula después (ADR-004).
        Exige sesión de reportante con el correo verificado (ADR-029) y la cabecera X-CSRF-Token (issue #16); el reporte guarda la cuenta,
        que nunca sale en respuestas ni eventos (EC-08). La misma Idempotency-Key usada por otra cuenta
        responde 409.

        Plausibilidad (ADR-030, EC-03): un precio fuera del piso y el techo absolutos se rechaza con 422
        IMPLAUSIBLE_PRICE. Uno dentro de ellos pero muy lejos de lo habitual (menos del 40 % o más del
        250 % de la mediana de las cuentas, de otras tiendas del municipio o, si no hay, del mayorista
        SIPSA; valores provisionales) se recibe igual con 201 y estado recibido, pero reliability lo deja
        en_revision: no es el precio vigente, no entra al orden ni a «Más barato» y va a la cola de
        moderación. El estado final se lee en GET /me/reports (status en_revision), no en esta respuesta.

        Reintentos (EC-07): la Idempotency-Key se reconoce antes que la regla de duplicados. Si el primer
        envío se aplicó pero el cliente no recibió la respuesta (corte de red), repetir la MISMA clave con
        el MISMO cuerpo devuelve 200 con el recibo original, sin importar cuánto tiempo pase, y nunca
        409 DUPLICATE_REPORT. El cliente debe guardar la clave con el reporte en la cola y reutilizarla;
        si genera una clave nueva al reintentar, el mismo precio responde 409 DUPLICATE_REPORT.

        Cola sin conexión (ADR-010, #30): la PWA manda cada reporte de la cola por esta misma ruta, con
        su clave. Qué hacer con cada respuesta: 201 o 200, confirmado (sale de la cola); 400, 409 o 422,
        final (sale de la cola y avisa); 429 de un reporte que ya estaba en la cola, final (su hora de
        observación no cambia, así que no pasará); 401 o 403, iniciar sesión y reintentar con la misma
        clave; sin red o 5xx, reintentar más tarde con la misma clave.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportCreate' }
      responses:
        '201':
          description: Reporte recibido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportReceipt' }
        '200':
          description: Reintento con la misma clave y el mismo cuerpo; se devuelve el id, el estado y la hora de llegada originales
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Se requiere sesión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >-
            code FORBIDDEN, CSRF_TOKEN_INVALID o ACCOUNT_SUSPENDED, como en toda ruta con sesión. code
            EMAIL_NOT_VERIFIED (ADR-029): la cuenta aún no verificó su correo; el frontend avisa y ofrece
            POST /auth/resend-verification. Se responde antes de validar el cuerpo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: EMAIL_NOT_VERIFIED
                message: Verifica tu correo para registrar precios. Revisa tu bandeja o pide un enlace nuevo.
        '409':
          description: >-
            Conflicto. code IDEMPOTENCY_KEY_REUSED: la misma Idempotency-Key ya se usó con otro cuerpo o por otra cuenta.
            code DUPLICATE_REPORT: la cuenta ya tiene un reporte de esa presentación en ese
            establecimiento observado a menos de 60 minutos de este (por la hora de observación, no de
            llegada; valor provisional, #29, #30). Solo este código trae availableFrom: la hora de
            observación desde la que se acepta otro reporte; reintentar el mismo nunca pasa (#84).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConflictError' }
        '422':
          description: >-
            Regla de negocio incumplida. code INVALID_OBSERVATION_DATE: observedAt está más de 5 minutos
            en el futuro o es de hace más de 24 horas, aunque venga de la cola sin conexión (#29). code
            UNKNOWN_PRESENTATION o UNKNOWN_ESTABLISHMENT: la presentación o el establecimiento no existen.
            code IMPLAUSIBLE_PRICE (ADR-030, EC-03): el precio es menor que $100 o mayor que $5.000.000
            (valores provisionales); no se guarda nada. El mensaje viene en español, por ejemplo «El
            precio parece incompleto: ningún producto cuesta menos de $100. Revisa si faltan ceros».
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: >-
            Más de 20 reportes de la cuenta observados dentro de una misma hora (por la hora de
            observación, no de llegada; valor provisional, RF-012 RN2, #29, #30). Retry-After dice
            cuántos segundos faltan para que una observación nueva pueda entrar. Los reportes de esa hora
            van a la cola de moderación con el motivo rafaga.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /reports/{reportId}/flag:
    post:
      tags: [Reportes]
      operationId: flagReport
      summary: Marcar un precio como dudoso (RF-013)
      description: >-
        Solo el rol reportante. Una marca por cuenta y reporte (RN1); el reporte entra a la cola de
        moderación con el motivo marcado. Quién marca no se muestra a nadie (EC-08). Si el reporte era
        el precio vigente de esa tienda, pasa a en_revision (EC-03, ADR-030): deja de ser el precio
        mostrado y de ser «Más barato» hasta que un moderador lo apruebe (vuelve a vigente) o lo
        descarte.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [precio_falso, producto_equivocado, establecimiento_equivocado, otro] }
                comment: { type: string, maxLength: 280 }
      responses:
        '202': { description: Señal recibida para moderación }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El reporte no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: code ALREADY_FLAGGED, esta cuenta ya marcó este reporte.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /reports/{reportId}/appeal:
    post:
      tags: [Reportes]
      operationId: appealReport
      summary: Apelar un reporte descartado, una sola vez (RF-013 RN4)
      description: >-
        Solo el autor del reporte, hasta 7 días después del descarte (valor provisional). Entra a la
        cola de moderación con el motivo apelacion y la decide un moderador distinto del que
        descartó. Una cuenta suspendida también puede apelar (#71).
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '202': { description: Apelación recibida }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El reporte no existe o no es de esta cuenta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: code ALREADY_APPEALED, el reporte ya se apeló.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            code NOT_APPEALABLE, el reporte no está descartado. code APPEAL_WINDOW_CLOSED, pasaron
            7 días desde el descarte.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/reports/{reportId}/status:
    get:
      tags: [Reportes]
      operationId: getMyReportStatus
      summary: Estado de un reporte propio y hasta cuándo se puede apelar (RF-013 RN4)
      description: >-
        Solo el autor. Nunca dice quién decidió ni quién marcó (EC-08). Sin caché (no-store). Una
        cuenta suspendida también puede consultarlo (#71).
      security:
        - sessionCookie: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Estado del reporte
          content:
            application/json:
              schema:
                type: object
                required: [reportId, status]
                properties:
                  reportId: { type: string, format: uuid }
                  status:
                    type: string
                    enum:
                      [
                        normal,
                        en_revision,
                        descartado,
                        apelacion_pendiente,
                        apelacion_aceptada,
                        apelacion_rechazada,
                      ]
                  appealableUntil:
                    type: string
                    format: date-time
                    description: Solo si el reporte está descartado y todavía se puede apelar.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El reporte no existe o no es de esta cuenta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/account-deletion:
    post:
      tags: [Autenticación]
      operationId: requestAccountDeletion
      summary: Eliminar la propia cuenta, con 10 días de gracia (Ley 1581, art. 8; ADR-032)
      description: >-
        Derecho de supresión. Cualquier rol, también una cuenta suspendida. Pide la contraseña; una cuenta
        creada con Google no tiene contraseña y confirma escribiendo su correo (confirmEmail, #179). No borra
        todavía: marca la cuenta como pendiente de eliminación para dentro de 10 días, revoca todas sus
        sesiones y limpia la cookie. Pedirla otra vez no mueve la fecha. Durante la gracia la persona no
        puede iniciar sesión (403 ACCOUNT_PENDING_DELETION) salvo para restaurarla con POST
        /auth/restore-account. Pasada la fecha, un trabajo interno (cada hora y al arrancar el servidor;
        puede retrasarse unas horas, nunca se adelanta) borra la cuenta y todo lo que cuelga de ella. Los
        reportes de precios, las propuestas y las marcas se conservan sin ningún dato personal.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: >-
                Exactamente uno de los dos: password (cuentas con contraseña) o confirmEmail (cuentas sin
                contraseña). Ninguno o los dos responde 400 VALIDATION_ERROR.
              oneOf:
                - type: object
                  required: [password]
                  additionalProperties: false
                  properties:
                    password: { type: string, maxLength: 128, writeOnly: true }
                - type: object
                  required: [confirmEmail]
                  additionalProperties: false
                  properties:
                    confirmEmail:
                      type: string
                      maxLength: 254
                      writeOnly: true
                      description: El correo de la cuenta; se compara sin espacios y en minúsculas.
      responses:
        '202':
          description: Eliminación programada; la cookie de sesión se borra
          headers:
            Set-Cookie:
              description: valora_session vacía y vencida (Max-Age=0).
              schema: { type: string }
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [scheduledFor]
                description: Sin correo, nombre ni id de la cuenta (EC-08).
                properties:
                  scheduledFor:
                    type: string
                    format: date-time
                    description: Momento desde el que la cuenta se puede borrar de forma definitiva (ahora más 10 días).
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            code INVALID_PASSWORD (la contraseña no coincide, o una cuenta con contraseña envió
            confirmEmail; no se programa nada), code INVALID_CONFIRMATION (una cuenta sin contraseña
            escribió un correo que no es el suyo), code
            LAST_MODERATOR_CANNOT_DELETE (es el único moderador activo) o code CSRF_TOKEN_INVALID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: >-
            Más de 5 confirmaciones incorrectas por cuenta o 20 intentos por IP en 15 minutos.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/reports:
    get:
      tags: [Reportes]
      operationId: listMyReports
      summary: Consultar mis aportes con su estado (RF-006)
      description: >-
        Solo el rol reportante (también con una cuenta suspendida). El más reciente primero. Un
        reporte aparece cuando reliability lo evalúa (segundos después de enviarlo). Nunca dice
        quién decidió ni quién marcó (EC-08). Sin caché (no-store) (#76).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: before
          in: query
          description: El nextBefore de la página anterior.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Aportes de la cuenta autenticada
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          reportId,
                          productName,
                          establishmentName,
                          priceCop,
                          priceType,
                          observedAt,
                          status,
                        ]
                      properties:
                        reportId: { type: string, format: uuid }
                        productId:
                          type: string
                          format: uuid
                          description: >-
                            El producto del aporte, para enlazar a /productos/{id}. Falta solo si la
                            presentación ya no existe en el catálogo (entonces productName es «Sin nombre»).
                        productName: { type: string }
                        establishmentName: { type: string }
                        priceCop: { type: integer, minimum: 1 }
                        priceType: { type: string, enum: [normal, oferta] }
                        observedAt: { type: string, format: date-time }
                        status:
                          type: string
                          enum:
                            [
                              normal,
                              en_revision,
                              descartado,
                              apelacion_pendiente,
                              apelacion_aceptada,
                              apelacion_rechazada,
                            ]
                        appealableUntil:
                          type: string
                          format: date-time
                          description: Solo si el reporte está descartado y todavía se puede apelar.
                  nextBefore:
                    type: string
                    format: date-time
                    description: Solo si la página está llena; se manda como before para la siguiente.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /product-requests:
    post:
      tags: [Catálogo]
      operationId: requestProduct
      summary: Proponer un producto que no existe en el catálogo (RF-003)
      description: >-
        Solo el rol reportante. La propuesta queda pendiente y no aparece en la búsqueda hasta que un
        moderador la aprueba (RN3). Se guarda la clave seudónima de quien propone, nunca su cuenta
        (EC-08) (#26).
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, categoryCode, quantity, unit]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                brand: { type: string, maxLength: 80 }
                categoryCode: { type: string, description: Código de la lista cerrada de categorías. }
                quantity: { type: number, exclusiveMinimum: 0 }
                unit: { $ref: '#/components/schemas/Unit' }
                packCount: { type: integer, minimum: 1, default: 1 }
                barcode:
                  type: string
                  pattern: '^(\d{8}|\d{12}|\d{13}|\d{14})$'
                  description: Opcional; EAN/UPC con dígito de control válido.
      responses:
        '202':
          description: Propuesta recibida, pendiente de moderación
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [pendiente] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: code BARCODE_TAKEN, el código ya es de un producto; message dice cuál (RN2).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: code UNKNOWN_CATEGORY, la categoría no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/register:
    post:
      tags: [Autenticación]
      operationId: register
      summary: Crear cuenta de reportante con consentimiento de datos (RF-001, Ley 1581)
      description: >-
        La cuenta nueva siempre es reportante, no inicia sesión y recibe por correo el enlace de verificación (ADR-029); si el envío falla, el registro no falla. Si el correo ya tiene cuenta, responde
        201 igual y no cambia nada, para no revelar qué correos están registrados (EC-08). El correo se
        guarda sin espacios y en minúsculas. El nombre visible (#133) se guarda sin espacios sobrantes y
        solo lo devuelve GET /auth/session de la propia cuenta; ninguna otra respuesta lo incluye (EC-08).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, displayName, password, acceptedPolicyVersion]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 40
                  description: >-
                    Nombre con el que la app saluda («Hola, Sara»). De 2 a 40 caracteres después de quitar
                    los espacios sobrantes; solo letras (con tildes y ñ), espacios, apóstrofo y guion. Sin
                    números, correos ni símbolos: responde 400 VALIDATION_ERROR.
                password: { type: string, minLength: 10, maxLength: 128, writeOnly: true }
                acceptedPolicyVersion:
                  type: string
                  enum: ['2026-11']
                  description: Versión vigente de la política de datos (provisional hasta tener el texto).
      responses:
        '201': { description: Cuenta creada, o correo ya registrado (misma respuesta) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429':
          description: Más de 10 registros por IP en 15 minutos (valores provisionales).
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/login:
    post:
      tags: [Autenticación]
      operationId: login
      summary: Iniciar sesión; el servidor entrega la cookie de sesión (ADR-014)
      description: >-
        Cada inicio de sesión crea una sesión y un token nuevos. La sesión vence tras 7 días sin uso o
        30 días después del inicio (valores provisionales). Después, GET /auth/session entrega el token
        CSRF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, maxLength: 128, writeOnly: true }
      responses:
        '204':
          description: Sesión iniciada
          headers:
            Set-Cookie:
              description: >-
                valora_session con HttpOnly, Secure, SameSite=Lax, Path=/ y Max-Age de 30 días.
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: >-
            code UNAUTHORIZED con «Correo o contraseña incorrectos.», exista o no la cuenta. Una cuenta
            creada con Google no tiene contraseña y recibe este mismo error (no revela cómo se creó, EC-08).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >-
            code ACCOUNT_PENDING_DELETION: la contraseña es correcta, pero la cuenta tiene la eliminación
            pendiente (ADR-032). No se crea sesión; scheduledFor dice cuándo se borra y POST
            /auth/restore-account la restaura. Con una contraseña incorrecta el error es el 401 genérico:
            no revela que la cuenta existe ni su estado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingDeletionError' }
        '429':
          description: >-
            Más de 5 fallos por correo o 20 intentos por IP en 15 minutos (valores provisionales). No
            revela si la cuenta existe.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/restore-account:
    post:
      tags: [Autenticación]
      operationId: restoreAccount
      summary: Restaurar una cuenta con la eliminación pendiente e iniciar sesión (ADR-032)
      description: >-
        Pública, sin sesión (como el login, no lleva token CSRF). Si la cuenta tiene la eliminación
        pendiente y la contraseña es correcta, cancela la eliminación y deja la sesión iniciada con la
        misma respuesta y cookie que POST /auth/login. Si el correo no existe, la contraseña es mala o la
        cuenta no estaba pendiente, responde el mismo 401 genérico del login. Comparte con el login el
        límite de intentos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, maxLength: 128, writeOnly: true }
      responses:
        '204':
          description: Eliminación cancelada y sesión iniciada
          headers:
            Set-Cookie:
              description: >-
                valora_session con HttpOnly, Secure, SameSite=Lax, Path=/ y Max-Age de 30 días.
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: >-
            code UNAUTHORIZED con «Correo o contraseña incorrectos.», exista o no la cuenta y esté o no
            pendiente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Mismo límite que el login (5 fallos por correo o 20 intentos por IP en 15 minutos).
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/logout:
    post:
      tags: [Autenticación]
      operationId: logout
      summary: Cerrar sesión y revocarla en el servidor
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204': { description: Sesión revocada en el servidor; la cookie se borra }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/session:
    get:
      tags: [Autenticación]
      operationId: getSession
      summary: Consultar la sesión actual y su rol (RF-002)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sesión activa
          headers:
            Cache-Control:
              description: Lleva el token CSRF; nunca se guarda en caché.
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [role, emailVerified, emailVerificationRequired, csrfToken]
                description: Sin correo ni id de la cuenta (EC-08).
                properties:
                  role: { type: string, enum: [reportante, comercio, moderador] }
                  emailVerified:
                    type: boolean
                    description: >-
                      ADR-029: si la cuenta ya verificó su correo. Sin verificar puede iniciar sesión y
                      consultar, pero POST /reports responde 403 EMAIL_NOT_VERIFIED. Solo la propia
                      sesión lo dice; ninguna respuesta pública lo incluye (EC-08). Las cuentas anteriores
                      a ADR-029 empiezan en false.
                  emailVerificationRequired:
                    type: boolean
                    description: >-
                      ADR-029: si el servidor exige el correo verificado para registrar precios
                      (REQUIRE_VERIFIED_EMAIL). Con false la app no muestra el aviso de verificación.
                  displayName:
                    type: string
                    description: >-
                      El nombre visible de la propia cuenta (#133). No viene en las cuentas creadas antes
                      de que se pidiera. Es la única respuesta que lo incluye (EC-08).
                  csrfToken:
                    type: string
                    description: >-
                      Va en la cabecera X-CSRF-Token de las rutas con sesión que modifican datos. El
                      frontend lo guarda en memoria.
                  suspendedUntil:
                    type: string
                    format: date-time
                    description: >-
                      Solo si la cuenta está suspendida: la sesión está limitada a ver el estado de
                      sus reportes y apelar (#71).
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/verify-email:
    post:
      tags: [Autenticación]
      operationId: verifyEmail
      summary: Verificar el correo con el token del enlace (ADR-029)
      description: >-
        Pública: el token del enlace que llegó por correo es la credencial, así que no pide sesión ni
        CSRF. Es un POST y no un GET para que los antivirus y las vistas previas de los enlaces no
        gasten el token. El token vale 24 horas y un solo uso; solo se guarda su hash. Un token
        desconocido, vencido o ya usado responde igual (422 INVALID_VERIFICATION_TOKEN), sin decir cuál.
        Si la cuenta ya estaba verificada, un token vigente responde 204 y no cambia la fecha original.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: El valor de ?token= del enlace (43 caracteres en base64url).
      responses:
        '204': { description: Correo verificado (o la cuenta ya lo estaba) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422':
          description: >-
            code INVALID_VERIFICATION_TOKEN: el enlace no es válido, venció o ya se usó. Hay que pedir
            uno nuevo con POST /auth/resend-verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Más de 20 intentos por IP en 15 minutos (valores provisionales).
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/resend-verification:
    post:
      tags: [Autenticación]
      operationId: resendVerification
      summary: Reenviar el correo de verificación a la cuenta de la sesión (ADR-029)
      description: >-
        Sin cuerpo: el correo sale a la cuenta de la sesión, nunca a una dirección recibida, así que no
        revela qué correos existen (EC-08). Un enlace nuevo deja sin efecto los anteriores sin usar.
        Responde 202 igual si la cuenta ya estaba verificada (no se envía nada) o si el envío se
        encola. Una cuenta suspendida también puede usarla.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '202': { description: Solicitud aceptada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: Más de 3 reenvíos por cuenta en una hora (valores provisionales).
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/google/start:
    get:
      tags: [Autenticación]
      operationId: startGoogleSignIn
      summary: Empezar a entrar con Google (ADR-029, fase 2)
      description: >-
        La persona llega aquí por el navegador (un enlace, no fetch). Responde 302 a Google con PKCE
        (S256), state, nonce y los alcances openid email profile, y guarda state, nonce y el verificador
        en la cookie valora_google, firmada y con 10 minutos de vida. No guarda nada en la base. 404 si
        el servidor no tiene configurado Google (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET y
        GOOGLE_REDIRECT_URI).
      responses:
        '302':
          description: Redirige a accounts.google.com
          headers:
            Location:
              description: https://accounts.google.com/o/oauth2/v2/auth con los parámetros del flujo.
              schema: { type: string }
            Set-Cookie:
              description: >-
                valora_google con HttpOnly, Secure, SameSite=Lax, Path=/v1/auth/google y Max-Age de 600 s.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, example: no-store }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/google/callback:
    get:
      tags: [Autenticación]
      operationId: googleSignInCallback
      summary: Vuelta desde Google; abre la sesión o pide aceptar la política (ADR-029, fase 2)
      description: >-
        Siempre responde 302 hacia la PWA (la persona llega por el navegador) y borra valora_google.
        Con una cuenta vinculada o cuyo correo coincide, abre la misma sesión que POST /auth/login y
        lleva a /. Con un correo sin cuenta no crea nada: guarda en la cookie firmada
        valora_google_signup (10 minutos) el sub, el correo y el nombre que da Google, y lleva a
        /bienvenida para aceptar la política (RF-001). Si algo falla lleva a /entrar?error=, con uno de
        google (state distinto o ausente, código o id_token inválido), google-correo-sin-verificar,
        eliminacion-pendiente; si la persona canceló en Google, a /entrar sin error. Nunca pone el
        correo, el sub ni tokens en la URL (EC-08).
      parameters:
        - name: code
          in: query
          description: Código de autorización que envía Google.
          schema: { type: string }
        - name: state
          in: query
          description: Debe ser igual al guardado en valora_google.
          schema: { type: string }
        - name: error
          in: query
          description: Lo envía Google si la persona canceló (access_denied) u otro fallo.
          schema: { type: string }
      responses:
        '302':
          description: Redirige a /, /bienvenida o /entrar (con o sin error)
          headers:
            Location:
              description: Una ruta de la PWA en el mismo origen.
              schema: { type: string, example: /bienvenida }
            Set-Cookie:
              description: >-
                Borra valora_google y, según el caso, entrega valora_session (como POST /auth/login) o
                valora_google_signup (HttpOnly, Secure, SameSite=Lax, Path=/v1/auth/google, Max-Age de 600 s).
              schema: { type: string }
            Cache-Control:
              schema: { type: string, example: no-store }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/google/complete:
    post:
      tags: [Autenticación]
      operationId: completeGoogleSignUp
      summary: Crear la cuenta de quien entró con Google al aceptar la política (RF-001, ADR-029)
      description: >-
        Exige la cookie valora_google_signup vigente que dejó el callback; sin ella o vencida responde
        401. Crea una cuenta reportante sin contraseña, con el correo ya verificado y vinculada a Google,
        abre la sesión (como POST /auth/login) y borra valora_google_signup. Si mientras tanto alguien
        creó una cuenta con ese correo, se vincula a ella. El correo nunca viaja en el cuerpo: sale de la
        cookie firmada. Sin token CSRF: aún no hay sesión, y SameSite=Lax impide que otro sitio envíe la
        cookie en un POST.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, acceptedPolicyVersion]
              additionalProperties: false
              properties:
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 40
                  description: Mismas reglas que en POST /auth/register.
                acceptedPolicyVersion:
                  type: string
                  enum: ['2026-11']
                  description: Versión vigente de la política de datos.
      responses:
        '204':
          description: Cuenta creada (o vinculada) y sesión iniciada
          headers:
            Set-Cookie:
              description: valora_session como en POST /auth/login, y valora_google_signup vacía y vencida.
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: Más de 10 registros por IP en 15 minutos (el mismo límite de POST /auth/register).
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /moderation/queue:
    get:
      tags: [Moderación]
      operationId: getModerationQueue
      summary: Cola de reportes en revisión (RF-012, RF-013)
      description: >-
        Solo el rol moderador. Reportes sin decisión que la detección marcó sospechosos (desviacion)
        o que alguna cuenta marcó como dudosos (marcado). Orden por gravedad (RN2): primero
        desviacion, de mayor a menor desviación; luego marcado, de más a menos marcas; en empate, el
        más antiguo. Hoy solo aparecen desviacion y marcado; las demás llegan con el corte 3.
      security:
        - sessionCookie: []
      parameters:
        - name: reason
          in: query
          schema: { type: string, enum: [apelacion, desviacion, rafaga, marcado, discrepancia_oficial, verificacion_comercio] }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Elementos pendientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ModerationItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /moderation/{itemId}/decision:
    post:
      tags: [Moderación]
      operationId: decideModerationItem
      summary: Registrar la decisión del moderador; queda auditada (RF-013)
      description: >-
        Solo el rol moderador. itemId es el id del reporte. Toda decisión exige motivo (RN3) y queda
        en una bitácora que no se puede modificar. aprobar vuelve a mostrar el precio como normal;
        descartar deja de mostrarlo (pasa al precio confiable más reciente de la tienda) y baja la
        reputación de su autor; si es el tercer descarte seguido de ese autor, su cuenta se suspende
        7 días (RN6). observar_cuentas suspende 7 días al autor del reporte, que sigue en la cola. El
        moderador nunca ve quién es el autor; la suspensión revoca sus sesiones (#33).
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, note]
              properties:
                decision: { type: string, enum: [aprobar, descartar, observar_cuentas] }
                note: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '204': { description: Decisión registrada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El reporte no está en la cola (no existe o ya se decidió).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            code OWN_REPORT: el moderador es el autor del reporte; lo decide otro moderador (#73).
            code SAME_MODERATOR: quien descartó el reporte no decide su apelación (#71).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: code DECISION_NOT_ALLOWED, observar_cuentas sobre una apelación (#71).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /moderation/store-proposals:
    get:
      tags: [Moderación]
      operationId: listStoreProposals
      summary: Tiendas propuestas pendientes de decisión (RF-005)
      description: >-
        Solo el rol moderador. La más antigua primero. Cada una dice si está fuera de la zona de
        servicio (rectángulo aproximado del Quindío, RN1) y trae sus posibles duplicados: tiendas a
        menos de 50 m con un nombre equivalente (RN3; valores provisionales). No dice quién la propuso
        (EC-08). Sin caché (#27). Desde la #207 trae también las correcciones de nombre o ubicación
        que pidió un comercio (kind correccion), con el valor actual y el propuesto (D5).
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Propuestas pendientes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/StoreProposalQueueItem'
                        - $ref: '#/components/schemas/StoreCorrectionQueueItem'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /moderation/store-proposals/{proposalId}/decision:
    post:
      tags: [Moderación]
      operationId: decideStoreProposal
      summary: Aprobar, fusionar o rechazar una tienda propuesta (RF-005)
      description: >-
        Solo el rol moderador. aprobar crea la tienda (aparece en el mapa) con el id de la propuesta;
        fusionar la une a una tienda existente (mergeInto) sin crear nada, nunca de forma automática
        (RN3); rechazar no crea nada. Siempre con motivo (#27). Con el id de una corrección (#207):
        aprobar aplica el nombre o la ubicación a la tienda y rechazar la descarta; una corrección no
        se fusiona.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, note]
              properties:
                decision: { type: string, enum: [aprobar, fusionar, rechazar] }
                note: { type: string, minLength: 10, maxLength: 500 }
                mergeInto:
                  type: string
                  format: uuid
                  description: Obligatorio con fusionar; la tienda existente.
      responses:
        '204': { description: Decisión registrada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: La propuesta no existe o ya se decidió.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: code UNKNOWN_ESTABLISHMENT, la tienda con la que se quiere fusionar no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /moderation/products/{productId}/image:
    put:
      tags: [Moderación]
      operationId: setProductImage
      summary: Subir la foto de un producto (ADR-020)
      description: >-
        Solo el rol moderador (en el Corte 2, fotos del equipo). JPEG, PNG o WebP de hasta 2 MB. El
        servidor la reduce a 800 px de lado mayor como máximo, la guarda en WebP y descarta todos sus
        metadatos, incluida la ubicación (EC-08). Reemplaza la imagen del producto, también una de Open
        Food Facts. La foto se sirve fuera de /v1, en solo lectura, en MEDIA_PUBLIC_URL (hoy
        /media/products/<archivo>.webp, con Cache-Control public, max-age=31536000, immutable) hasta
        decidir el proveedor (ADR-012) (#88).
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: La imagen del producto
          content:
            application/json:
              schema:
                type: object
                required: [url, source, attribution]
                properties:
                  url: { type: string, format: uri }
                  source: { type: string, enum: [equipo] }
                  attribution: { type: string, example: Equipo Valora }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El producto no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: code PAYLOAD_TOO_LARGE, la foto pesa más de 2 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /moderation/product-requests:
    get:
      tags: [Moderación]
      operationId: listProductRequests
      summary: Productos propuestos pendientes de decisión (RF-003)
      description: >-
        Solo el rol moderador. La más antigua primero. Cada una trae hasta 5 posibles duplicados: los
        primeros resultados de la búsqueda de productos con su nombre y marca. No dice quién la propuso
        (EC-08). Sin caché (#26).
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Propuestas pendientes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, categoryCode, quantity, unit, packCount, possibleDuplicates, createdAt]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        brand: { type: string }
                        categoryCode: { type: string }
                        quantity: { type: number }
                        unit: { $ref: '#/components/schemas/Unit' }
                        packCount: { type: integer, minimum: 1 }
                        barcode: { type: string }
                        possibleDuplicates:
                          type: array
                          maxItems: 5
                          items:
                            type: object
                            required: [id, name]
                            properties:
                              id: { type: string, format: uuid }
                              name: { type: string }
                        createdAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /moderation/product-requests/{requestId}/decision:
    post:
      tags: [Moderación]
      operationId: decideProductRequest
      summary: Aprobar, fusionar o rechazar un producto propuesto (RF-003)
      description: >-
        Solo el rol moderador. aprobar crea el producto (aparece en la búsqueda) con el id de la
        propuesta y su presentación; fusionar agrega el nombre propuesto como alias de un producto
        existente (mergeInto) y la presentación si es nueva, nunca de forma automática; rechazar no
        crea nada. Siempre con motivo (#26).
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, note]
              properties:
                decision: { type: string, enum: [aprobar, fusionar, rechazar] }
                note: { type: string, minLength: 10, maxLength: 500 }
                mergeInto:
                  type: string
                  format: uuid
                  description: Obligatorio con fusionar; el producto existente.
      responses:
        '204': { description: Decisión registrada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: La propuesta no existe o ya se decidió.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            code BARCODE_TAKEN, otro producto tomó el código mientras la propuesta esperaba; solo se
            puede rechazar (RN2).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            code UNKNOWN_PRODUCT, el producto con el que se quiere fusionar no existe; o
            MIXED_UNIT_BASES, la presentación no comparte la base de unidad del producto (#59).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /moderation/roles:
    post:
      tags: [Moderación]
      operationId: changeAccountRole
      summary: Cambiar el rol de una cuenta; queda auditado (RF-002 RN1 y RN4)
      description: >-
        Solo el rol moderador. Vuelve moderadora una cuenta reportante o devuelve a reportante a otro
        moderador; el cambio se nota desde la siguiente petición de esa cuenta. Queda en una bitácora
        que no se puede modificar (quién, qué, cuándo y por qué). comercio no se asigna hasta el
        Corte 3. El administrador del sistema usa el comando pnpm identity:set-role (#73).
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role, note]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                role: { type: string, enum: [reportante, moderador] }
                note: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '204': { description: Rol cambiado y anotado en la bitácora }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Ninguna cuenta tiene ese correo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            code OWN_ROLE: un moderador no cambia su propio rol. code ROLE_UNCHANGED: la cuenta ya
            tiene ese rol.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Más de 20 cambios del mismo moderador en 15 minutos (valor provisional).
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /commerce/claims:
    post:
      tags: [Comercios]
      operationId: claimEstablishment
      summary: Registrar como suya una tienda, del mapa o nueva (RF-015)
      description: >-
        D2 y D3 del grill comercial (#201). Solo un reportante con el correo verificado. La persona
        debe estar a 50 m o menos de la tienda: location es la ubicación del celular en ese momento,
        solo sirve para comprobarlo y no se guarda (EC-08). Si todo está bien, la cuenta queda
        verificada como dueña de la tienda y su rol pasa a comercio. Una tienda por cuenta y un dueño
        por tienda. El NIT es opcional; sin NIT, el comercio es informal. Su dígito de verificación
        solo detecta errores al escribir: no se consulta a la DIAN.

        Si la tienda no está en el mapa (#202), se envía newEstablishment en lugar de establishmentId:
        se crea una propuesta de tienda en el punto de location (RF-005 RN7, la revisa el moderador) y
        la solicitud queda pre_aprobado. Al aprobarse la tienda, el comercio queda verificado solo;
        si el moderador la fusiona con una tienda sin dueño, queda verificado en esa tienda; si la
        rechaza o la tienda ya tenía dueño, la solicitud se cierra y GET /commerce/me muestra el
        motivo. El rol pasa a comercio cuando se verifica, por un evento interno: el frontend vuelve
        a pedir GET /auth/session.
      x-corte: 3
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [responsibleName, phone, acceptedTermsVersion, location]
              description: Exactamente uno de establishmentId (tienda del mapa) o newEstablishment.
              oneOf:
                - required: [establishmentId]
                - required: [newEstablishment]
              properties:
                establishmentId: { type: string, format: uuid }
                newEstablishment:
                  type: object
                  additionalProperties: false
                  required: [name, type, municipality]
                  description: La tienda que no está en el mapa; su punto es location.
                  properties:
                    name: { type: string, minLength: 2, maxLength: 120 }
                    type: { type: string, enum: [barrio, minimercado, supermercado, descuento] }
                    address: { type: string, maxLength: 200 }
                    municipality: { $ref: '#/components/schemas/Municipality' }
                responsibleName: { type: string, minLength: 2, maxLength: 80, example: Rosa Gómez }
                nit:
                  type: string
                  description: Con su dígito de verificación, con o sin puntos.
                  example: 800.197.268-4
                phone:
                  type: string
                  pattern: '^(3\d{9}|60\d{8})$'
                  description: Celular (10 dígitos que empiezan por 3) o fijo (60 + 8 dígitos).
                  example: '3001234567'
                acceptedTermsVersion:
                  type: string
                  description: Versión vigente de las condiciones para comercios.
                  example: '2026-11'
                location:
                  type: object
                  additionalProperties: false
                  required: [lat, lng]
                  description: >-
                    Ubicación del celular en el momento. Con establishmentId solo comprueba la
                    presencia y no se guarda; con newEstablishment es el punto de la tienda propuesta.
                  properties:
                    lat: { type: number, minimum: -90, maximum: 90 }
                    lng: { type: number, minimum: -180, maximum: 180 }
      responses:
        '201':
          description: >-
            verificado: la cuenta quedó como dueña de la tienda del mapa y su rol pasa a comercio.
            pre_aprobado: la tienda nueva espera la aprobación de su propuesta; unlocks dice lo que
            se desbloquea al aprobarse.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, establishmentId]
                properties:
                  status: { type: string, enum: [verificado, pre_aprobado] }
                  establishmentId:
                    type: string
                    format: uuid
                    description: Con pre_aprobado es el id de la propuesta, que será el de la tienda.
                  unlocks: { $ref: '#/components/schemas/MerchantUnlocks' }
        '400':
          description: >-
            Datos inválidos (VALIDATION_ERROR), también un NIT cuyo dígito de verificación no
            corresponde o una versión de las condiciones que no es la vigente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            code FORBIDDEN: la cuenta no es reportante (ya es comercio o moderador). code
            EMAIL_NOT_VERIFIED: la cuenta aún no verificó su correo (ADR-029). También
            CSRF_TOKEN_INVALID y ACCOUNT_SUSPENDED, como en toda ruta con sesión.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            code ESTABLISHMENT_HAS_OWNER: la tienda ya tiene dueño; queda una disputa para el
            moderador (#208). code ACCOUNT_HAS_ESTABLISHMENT: la cuenta ya tiene una tienda.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            code NOT_AT_ESTABLISHMENT: la ubicación está a más de 50 m de la tienda. code
            REVOKED_FROM_ESTABLISHMENT: un moderador revocó a esta cuenta de esta tienda (#208).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /commerce/me:
    get:
      tags: [Comercios]
      operationId: getMerchantProfile
      summary: Perfil del comercio de la sesión (RF-015)
      description: >-
        D3 del grill comercial (#201): la tienda de la cuenta y su estado. Nunca una ubicación (EC-08).
        Si la última solicitud se cerró y no hay otra, responde rechazado con el motivo (#202).
      x-corte: 3
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Perfil del comercio.
          headers:
            Cache-Control:
              description: Dato de la propia cuenta.
              schema: { type: string, example: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: code FORBIDDEN, un moderador no tiene perfil de comercio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: La cuenta no tiene una tienda registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /establishments/{establishmentId}/merchant-reports:
    post:
      tags: [Comercios]
      operationId: reportMerchant
      summary: Denunciar un comercio («no es de quien dice») (RF-015, D2)
      description: >-
        D2 y D3 del grill comercial (#208). Cualquier cuenta con sesión, sobre una tienda que tiene
        comercio, nunca la propia, y una denuncia abierta por cuenta y tienda. Se guarda la clave
        seudónima de quien denuncia, nunca su cuenta (EC-08). El moderador decide en
        GET /moderation/merchant-cases.
      x-corte: 3
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '202':
          description: Denuncia recibida, pendiente del moderador.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [pendiente] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: La tienda no tiene un comercio registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: code MERCHANT_REPORT_OPEN, ya denunció este comercio y el caso sigue abierto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: code OWN_ESTABLISHMENT, no se denuncia la tienda propia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /moderation/merchant-cases:
    get:
      tags: [Moderación]
      operationId: listMerchantCases
      summary: Denuncias y disputas de comercios pendientes (RF-015, D2)
      description: >-
        Solo el rol moderador (#208). La más antigua primero. Una disputa se abre sola cuando otra
        cuenta, estando en la tienda (presencia, D2), intenta registrar una tienda que ya tiene dueño.
        Trae los datos del comercio para verificarlo; nunca quién abrió el caso ni la cuenta del
        dueño (EC-08). Sin caché.
      x-corte: 3
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Casos pendientes.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MerchantCase' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /moderation/merchant-cases/{caseId}/decision:
    post:
      tags: [Moderación]
      operationId: decideMerchantCase
      summary: Revocar el comercio o descartar el caso (RF-015, D3)
      description: >-
        Solo el rol moderador (#208). revocar retira al instante los precios oficiales y las
        promociones de la tienda, devuelve la cuenta a reportante, cierra los casos abiertos de esa
        tienda y deja anotado quién, cuándo y por qué; esa cuenta no puede volver a registrar esa
        tienda. descartar cierra el caso sin tocar el comercio. Siempre con motivo.
      x-corte: 3
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, note]
              properties:
                decision: { type: string, enum: [revocar, descartar] }
                note: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '204': { description: Decisión registrada. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El caso no existe o ya se decidió.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /commerce/alerts:
    get:
      tags: [Comercios]
      operationId: listMerchantAlerts
      summary: Los avisos del comercio (RF-016, D4, ADR-008)
      description: >-
        B9 (#209). Solo un comercio verificado. vence_pronto: a un precio oficial le queda un día o
        menos de vigencia (D4); vencido: ya no está vigente; discrepancia: la comunidad corrobora otro
        precio (D1, ADR-008). Cada aviso trae el texto listo para mostrar. Los avisos nuevos también
        llegan por correo, en un resumen de máximo uno al día desde las 7:00 a. m. de Colombia
        (precisiones de D4); el correo lo envía identity, y commerce nunca lo conoce (EC-08).
      x-corte: 3
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Avisos de hoy.
          headers:
            Cache-Control:
              description: Dato de la propia cuenta.
              schema: { type: string, example: 'private, no-store' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MerchantAlert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: code FORBIDDEN o MERCHANT_NOT_VERIFIED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /commerce/establishment:
    patch:
      tags: [Comercios]
      operationId: updateMerchantEstablishment
      summary: Corregir los datos de su tienda (RF-015, D5)
      description: >-
        D5 del grill comercial (#207). Solo un comercio verificado, en su propia tienda. El horario,
        el teléfono y el nombre se aplican al instante, salvo un nombre equivalente al de otra tienda
        a menos de 50 m, que va al moderador. La ubicación va siempre al moderador, porque cambia la
        distancia que entra al orden neutral. Las correcciones esperan en la cola de propuestas de
        tiendas (GET /moderation/store-proposals).
      x-corte: 3
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                openingHours: { $ref: '#/components/schemas/OpeningHours' }
                phone:
                  type: string
                  pattern: '^(3\d{9}|60\d{8})$'
                  description: Celular (10 dígitos que empiezan por 3) o fijo (60 + 8 dígitos).
                name: { type: string, minLength: 2, maxLength: 120 }
                location:
                  type: object
                  additionalProperties: false
                  required: [lat, lng]
                  properties:
                    lat: { type: number, minimum: -90, maximum: 90 }
                    lng: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200':
          description: Qué se aplicó al instante y qué quedó en revisión.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [applied, inReview]
                properties:
                  applied:
                    type: array
                    items: { type: string, enum: [openingHours, phone, name] }
                  inReview:
                    type: array
                    items: { type: string, enum: [name, location] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: code FORBIDDEN o MERCHANT_NOT_VERIFIED, como en PUT /commerce/prices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: code INVALID_OPENING_HOURS, el horario no sirve (formato HH:MM, cierre después de la apertura, los 7 días).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /commerce/prices:
    put:
      tags: [Comercios]
      operationId: upsertOfficialPrice
      summary: Publicar o actualizar un precio oficial (RF-016, EC-02)
      description: >-
        D4 del grill comercial (#203). Solo un comercio verificado, en su propia tienda. Publicar otra
        vez la misma presentación reemplaza el precio y lo deja reconfirmado. El precio cumple el mismo
        piso y techo absolutos que un reporte (ADR-030). Vale lo mismo que un reporte (ADR-005),
        contando desde la última confirmación.
      x-corte: 3
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [presentationId, priceCop]
              properties:
                presentationId: { type: string, format: uuid }
                priceCop: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Precio oficial publicado y confirmado ahora.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfficialPrice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            code FORBIDDEN: la cuenta no es comercio. code MERCHANT_NOT_VERIFIED: su tienda no está
            verificada. También CSRF_TOKEN_INVALID y ACCOUNT_SUSPENDED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            code UNKNOWN_PRESENTATION: la presentación no está en el catálogo. code IMPLAUSIBLE_PRICE:
            menos de $100 o más de $5.000.000.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Comercios]
      operationId: listOfficialPrices
      summary: Los precios oficiales del comercio con su vigencia (RF-016)
      description: >-
        D4 del grill comercial (#203). La vigencia cuenta desde la última confirmación, con el TTL de
        la categoría (ADR-005).
      x-corte: 3
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sus precios oficiales, en el orden en que los publicó.
          headers:
            Cache-Control:
              description: Dato de la propia cuenta.
              schema: { type: string, example: 'private, no-store' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OfficialPriceWithFreshness' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: code FORBIDDEN o MERCHANT_NOT_VERIFIED, como en PUT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /commerce/prices/reconfirm:
    post:
      tags: [Comercios]
      operationId: reconfirmOfficialPrices
      summary: «Todos mis precios siguen igual» (RF-016)
      description: >-
        D4 del grill comercial (#203). Sin cuerpo: reconfirma de un toque todos los precios oficiales
        de su tienda.
      x-corte: 3
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Cuántos precios se reconfirmaron.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reconfirmed]
                properties:
                  reconfirmed: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: code FORBIDDEN o MERCHANT_NOT_VERIFIED, como en PUT /commerce/prices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /commerce/prices/bulk:
    post:
      tags: [Comercios]
      operationId: bulkOfficialPrices
      summary: Cargar precios oficiales por archivo CSV (RF-016, D7)
      description: >-
        D7 del grill comercial (#205, ADR-027). Se procesa al momento. El archivo es «CSV UTF-8» con
        el encabezado codigo_barras;precio y una fila por producto, separada por punto y coma; máximo
        1.000 filas y 1 MB. Las filas buenas se publican juntas y quedan reconfirmadas (D4); las malas
        se informan con su número de fila de Excel. Subir el mismo archivo otra vez actualiza sin
        duplicar. Nunca crea un producto: un código que no está en Valora falla con UNKNOWN_BARCODE.
      x-corte: 3
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              example: |
                codigo_barras;precio
                7702511000014;2600
      responses:
        '200':
          description: Cuántas filas se publicaron y cuáles fallaron.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [published, errors]
                properties:
                  published: { type: integer, minimum: 0 }
                  errors:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [row, barcode, code, message]
                      properties:
                        row: { type: integer, minimum: 2, description: Número de la fila en Excel. }
                        barcode: { type: string }
                        code: { type: string, enum: [INVALID_PRICE, DUPLICATE_ROW, UNKNOWN_BARCODE] }
                        message: { type: string }
        '400':
          description: VALIDATION_ERROR, el archivo no tiene el encabezado codigo_barras;precio o no es texto CSV.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: code FORBIDDEN o MERCHANT_NOT_VERIFIED, como en PUT /commerce/prices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: PAYLOAD_TOO_LARGE, más de 1.000 filas o de 1 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /commerce/promotions:
    post:
      tags: [Comercios]
      operationId: createPromotion
      summary: Publicar una promoción con reglas y vigencia (RF-017, EC-06)
      description: >-
        D6 del grill comercial (#206). Solo un comercio verificado, sobre el precio oficial VIGENTE de
        una presentación de su tienda (si no, 422 OFFICIAL_PRICE_REQUIRED). Condiciones fijas, sin
        texto libre. Dura como mucho 30 días; puede empezar en el futuro (queda programada). Si el
        oficial deja de estar vigente se pausa sola y reconfirmarlo la reactiva. Va siempre aparte
        de los resultados de la comparación y nunca cambia el orden (ADR-009).
      x-corte: 3
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Promotion' }
      responses:
        '201':
          description: Promoción publicada, con su estado de hoy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantPromotion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: code FORBIDDEN o MERCHANT_NOT_VERIFIED, como en PUT /commerce/prices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            code OFFICIAL_PRICE_REQUIRED: no hay precio oficial vigente de esa presentación. code
            INVALID_PROMOTION: la oferta no baja el oficial, está fuera de sus límites o las fechas
            no sirven (final antes del inicio o ya pasado, o más de 30 días).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Comercios]
      operationId: listMerchantPromotions
      summary: Las promociones del comercio con su estado de hoy (RF-017)
      x-corte: 3
      security:
        - sessionCookie: []
      responses:
        '200':
          description: La más reciente primero.
          headers:
            Cache-Control:
              description: Dato de la propia cuenta.
              schema: { type: string, example: 'private, no-store' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MerchantPromotion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: code FORBIDDEN o MERCHANT_NOT_VERIFIED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /commerce/promotions/{promotionId}:
    delete:
      tags: [Comercios]
      operationId: withdrawPromotion
      summary: Retirar una promoción propia (RF-017)
      x-corte: 3
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: promotionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Retirada; deja de salir en la comparación. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: code FORBIDDEN o MERCHANT_NOT_VERIFIED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No existe o es de otra tienda.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: valora_session
      description: >-
        Sesión administrada por el servidor (ADR-014): token aleatorio; la base guarda solo su hash.
        HttpOnly, Secure, SameSite=Lax. Vence tras 7 días sin uso o 30 desde el inicio.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Lo entrega GET /auth/session. Lo exigen las rutas con sesión y método POST, PUT, PATCH o
        DELETE.
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generado por la PWA al guardar el reporte en la cola local.
      schema: { type: string, format: uuid }
  headers:
    CacheControl:
      description: >-
        Caché del navegador (max-age) y de las cachés compartidas (s-maxage). Con ubicación, sesión o
        error, no-store (ADR-031).
      schema: { type: string, example: 'public, max-age=30, s-maxage=60, stale-while-revalidate=30' }
    RetryAfter:
      description: Segundos que faltan para poder intentar de nuevo.
      schema: { type: integer, minimum: 1 }
  responses:
    BadRequest:
      description: >-
        Datos inválidos. Responde code VALIDATION_ERROR; message junta los errores de cada campo como
        «campo: mensaje», separados por «; ». Un campo no declarado responde «campo: no está permitido»
        y un cuerpo que no es JSON válido, «El cuerpo de la solicitud no es JSON válido.»
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: >-
        Se requiere sesión. También responde así una sesión revocada o vencida.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: >-
        code FORBIDDEN: el rol no tiene permiso. code CSRF_TOKEN_INVALID: falta la cabecera
        X-CSRF-Token o no coincide con la sesión. code ACCOUNT_SUSPENDED: la cuenta está suspendida y
        su sesión solo sirve para ver el estado de sus reportes, apelar y cerrar sesión (#71). code
        EMAIL_NOT_VERIFIED: solo en POST /reports y POST /commerce/claims, la cuenta aún no verificó su correo (ADR-029).
        INVALID_PASSWORD y LAST_MODERATOR_CANNOT_DELETE: solo en POST /me/account-deletion (ADR-032).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Límite de frecuencia superado
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: Regla de negocio incumplida. code identifica la regla (por ejemplo, INVALID_QUANTITY).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalServerError:
      description: >-
        Error inesperado. Responde siempre code INTERNAL_ERROR y el mensaje «Ocurrió un error
        inesperado.»; el detalle solo queda en el registro del servidor.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    ConflictError:
      description: Error con availableFrom, solo en el 409 DUPLICATE_REPORT de POST /reports (#84).
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code: { type: string, example: DUPLICATE_REPORT }
        message: { type: string }
        availableFrom:
          type: string
          format: date-time
          description: Hora de observación desde la que se acepta otro reporte de esa presentación en esa tienda.
    PendingDeletionError:
      description: Error con scheduledFor, solo en el 403 ACCOUNT_PENDING_DELETION de POST /auth/login (ADR-032).
      type: object
      required: [code, message, scheduledFor]
      additionalProperties: false
      properties:
        code: { type: string, example: ACCOUNT_PENDING_DELETION }
        message: { type: string }
        scheduledFor:
          type: string
          format: date-time
          description: Cuándo se borra la cuenta de forma definitiva si no se restaura.
    OfficialPrice:
      type: object
      additionalProperties: false
      required: [establishmentId, presentationId, priceCop, confirmedAt]
      properties:
        establishmentId: { type: string, format: uuid }
        presentationId: { type: string, format: uuid }
        priceCop: { type: integer }
        confirmedAt: { type: string, format: date-time, description: Última confirmación. }
    OfficialPriceWithFreshness:
      type: object
      additionalProperties: false
      required: [establishmentId, presentationId, priceCop, confirmedAt, freshness]
      properties:
        establishmentId: { type: string, format: uuid }
        presentationId: { type: string, format: uuid }
        priceCop: { type: integer }
        confirmedAt: { type: string, format: date-time }
        freshness: { type: string, enum: [vigente, por_confirmar, desactualizado] }
    OpeningHours:
      type: object
      description: >-
        Horario de la tienda por día, sin texto libre (D5, precisiones del 22-nov). Cada día es null
        (cerrado) o abre y cierra el mismo día, en hora de Colombia.
      additionalProperties: false
      required: [lunes, martes, miercoles, jueves, viernes, sabado, domingo]
      properties:
        lunes: { $ref: '#/components/schemas/DayHours' }
        martes: { $ref: '#/components/schemas/DayHours' }
        miercoles: { $ref: '#/components/schemas/DayHours' }
        jueves: { $ref: '#/components/schemas/DayHours' }
        viernes: { $ref: '#/components/schemas/DayHours' }
        sabado: { $ref: '#/components/schemas/DayHours' }
        domingo: { $ref: '#/components/schemas/DayHours' }
    DayHours:
      type: [object, 'null']
      additionalProperties: false
      required: [opens, closes]
      properties:
        opens: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        closes: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
    StoreProposalQueueItem:
      type: object
      description: Una tienda propuesta (#27).
      required: [kind, id, name, type, lat, lng, municipality, outOfZone, possibleDuplicates, createdAt]
      properties:
        kind: { type: string, enum: [tienda] }
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [barrio, minimercado, supermercado, descuento] }
        address: { type: string }
        lat: { type: number }
        lng: { type: number }
        municipality: { $ref: '#/components/schemas/Municipality' }
        outOfZone: { type: boolean }
        possibleDuplicates: { $ref: '#/components/schemas/PossibleDuplicates' }
        createdAt: { type: string, format: date-time }
    StoreCorrectionQueueItem:
      type: object
      description: >-
        Una corrección de nombre o ubicación que pidió un comercio (D5, #207). No dice quién la pidió
        (EC-08).
      additionalProperties: false
      required: [kind, id, establishmentId, current, proposed, possibleDuplicates, createdAt]
      properties:
        kind: { type: string, enum: [correccion] }
        id: { type: string, format: uuid }
        establishmentId: { type: string, format: uuid }
        current:
          type: object
          additionalProperties: false
          required: [name, lat, lng]
          properties:
            name: { type: string }
            lat: { type: number }
            lng: { type: number }
        proposed:
          type: object
          additionalProperties: false
          description: Solo lo que cambia.
          properties:
            name: { type: string }
            lat: { type: number }
            lng: { type: number }
        possibleDuplicates: { $ref: '#/components/schemas/PossibleDuplicates' }
        createdAt: { type: string, format: date-time }
    PossibleDuplicates:
      type: array
      description: Tiendas a menos de 50 m con un nombre equivalente (RF-005 RN3).
      items:
        type: object
        required: [id, name, distanceM]
        properties:
          id: { type: string, format: uuid }
          name: { type: string }
          distanceM: { type: integer, minimum: 0 }
    MerchantCase:
      type: object
      description: Una denuncia o una disputa sobre un comercio (D2, D3); sin quién la abrió (EC-08).
      additionalProperties: false
      required: [id, kind, establishment, owner, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [denuncia, disputa] }
        establishment:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        owner:
          type: [object, 'null']
          description: El comercio, para verificarlo; null si ya no existe.
          additionalProperties: false
          required: [responsibleName, nit, phone, status, verifiedAt]
          properties:
            responsibleName: { type: string }
            nit: { type: [string, 'null'] }
            phone: { type: string }
            status: { type: string, enum: [pre_aprobado, verificado] }
            verifiedAt: { type: [string, 'null'], format: date-time }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    MerchantAlert:
      type: object
      description: Un aviso del comercio (#209). Los campos de precio solo vienen en discrepancia.
      additionalProperties: false
      required: [kind, presentationId, productName, message]
      properties:
        kind: { type: string, enum: [vence_pronto, vencido, discrepancia] }
        presentationId: { type: string, format: uuid }
        productName: { type: string }
        message: { type: string, description: Texto listo para mostrar. }
        confirmedAt:
          type: string
          format: date-time
          description: En vence_pronto y vencido, la última confirmación del oficial.
        officialPriceCop: { type: integer }
        reportedPriceCop: { type: integer, description: La mediana de los reportes que corroboran. }
        reports: { type: integer, minimum: 2 }
        since: { type: string, format: date-time }
    MerchantUnlocks:
      type: array
      description: Lo que el comercio pre-aprobado podrá hacer al aprobarse su tienda (D2).
      items:
        type: string
        enum: [precios_oficiales, carga_por_archivo, promociones, avisos_de_precio, datos_de_la_tienda]
    MerchantProfile:
      oneOf:
        - $ref: '#/components/schemas/ActiveMerchantProfile'
        - $ref: '#/components/schemas/RejectedMerchantProfile'
    RejectedMerchantProfile:
      type: object
      additionalProperties: false
      required: [status, reason, rejectedAt]
      properties:
        status:
          type: string
          enum: [rechazado, revocado]
          description: >-
            rechazado, la tienda propuesta no se aprobó (#202); revocado, un moderador revocó el
            comercio (#208).
        reason: { type: string, description: Motivo del moderador o de la fusión. }
        rejectedAt: { type: string, format: date-time }
    ActiveMerchantProfile:
      type: object
      additionalProperties: false
      required: [status, establishment, responsibleName, informal, verifiedAt]
      properties:
        status: { type: string, enum: [pre_aprobado, verificado] }
        establishment:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        responsibleName: { type: string }
        informal: { type: boolean, description: Sin NIT. }
        verifiedAt: { type: [string, 'null'], format: date-time, description: null si está pre-aprobado. }
        unlocks: { $ref: '#/components/schemas/MerchantUnlocks' }
    Error:
      type: object
      description: >-
        Única forma de error de la API (issue #41). Solo tiene code y message; la única excepción es
        availableFrom en el 409 DUPLICATE_REPORT (ConflictError, #84) y scheduledFor en el 403 ACCOUNT_PENDING_DELETION (PendingDeletionError, ADR-032). Valores de code:
        VALIDATION_ERROR (400), UNAUTHORIZED (401), FORBIDDEN (403), EMAIL_NOT_VERIFIED (403), MERCHANT_NOT_VERIFIED (403), INVALID_PASSWORD (403), LAST_MODERATOR_CANNOT_DELETE (403), ACCOUNT_PENDING_DELETION (403), NOT_FOUND (404),
        CONFLICT (409), ESTABLISHMENT_HAS_OWNER (409), ACCOUNT_HAS_ESTABLISHMENT (409), MERCHANT_REPORT_OPEN (409), PAYLOAD_TOO_LARGE (413), TOO_MANY_REQUESTS (429), REQUEST_ERROR (otro 4xx), INTERNAL_ERROR (500) y,
        con 422, el de cada regla de negocio: INVALID_PRICE, INVALID_QUANTITY, INCOMPATIBLE_UNITS,
        INVALID_OBSERVATION_DATE, IMPLAUSIBLE_PRICE, INVALID_TTL, INVALID_VERIFICATION_TOKEN, NOT_AT_ESTABLISHMENT, UNKNOWN_PRESENTATION, OFFICIAL_PRICE_REQUIRED, INVALID_PROMOTION, INVALID_OPENING_HOURS, OWN_ESTABLISHMENT, REVOKED_FROM_ESTABLISHMENT y los que agreguen las reglas futuras.
      required: [code, message]
      additionalProperties: false
      properties:
        code: { type: string, example: INVALID_QUANTITY }
        message: { type: string, example: La cantidad de la presentación debe ser mayor que cero. }
    Unit:
      type: string
      description: Unidad tal como se escribe en el empaque; la unidad base (g, ml, und) la calcula el dominio (RF-004).
      enum: [g, kg, ml, l, und]
    Presentation:
      type: object
      required: [id, quantity, unit, packCount]
      properties:
        id: { type: string, format: uuid }
        barcode: { type: string, description: Único en el catálogo (RF-003 RN2). }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { $ref: '#/components/schemas/Unit' }
        packCount:
          type: integer
          minimum: 1
          description: Unidades del empaque (6 en «6 × 330 ml»); 1 si no es un empaque.
    Category:
      type: object
      required: [code, name]
      properties:
        code: { type: string, example: dairy-eggs, description: Código fijo de la lista cerrada de categorías. }
        name: { type: string, example: Lácteos y huevos }
    ProductImage:
      type: object
      required: [url, source, attribution]
      properties:
        url: { type: string, format: uri }
        source: { type: string, enum: [open_food_facts, equipo] }
        attribution: { type: string }
    Product:
      type: object
      required: [id, name, category, presentations]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        brand: { type: string, description: Opcional; los productos a granel o frescos pueden no tener marca. }
        category: { $ref: '#/components/schemas/Category' }
        image:
          description: >-
            Opcional; enlace a la foto con su fuente y su atribución (ADR-020, #26). Sin image, el
            frontend muestra la ilustración genérica.
          allOf: [{ $ref: '#/components/schemas/ProductImage' }]
        presentations:
          type: array
          items: { $ref: '#/components/schemas/Presentation' }
    Establishment:
      type: object
      required: [id, name, type, lat, lng, municipality]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [barrio, minimercado, supermercado, descuento] }
        address: { type: string, description: Opcional; muchas tiendas no tienen dirección formal. }
        neighborhood:
          type: string
          description: >-
            Opcional (H-06): barrio de la tienda, cuando el directorio lo tiene. Junto con address distingue
            tiendas de la misma cadena. Dato público de la tienda, no del usuario.
        lat: { type: number, description: Latitud de la tienda (nunca la del usuario, RF-005 RN4). }
        lng: { type: number, description: Longitud de la tienda. }
        municipality: { $ref: '#/components/schemas/Municipality' }
        distanceM:
          type: integer
          minimum: 0
          description: >-
            Metros desde el punto consultado; viene en GET /establishments/nearby y en la comparación
            cuando se envió la ubicación (#106).
    EstablishmentWithPrices:
      type: object
      description: >-
        Una tienda de las listas GET /establishments y GET /establishments/nearby: los campos de
        Establishment más cuántos precios vigentes tiene (B#131). La comparación y los precios de una
        tienda siguen usando Establishment. Va sin allOf porque las respuestas no admiten campos de más.
      required: [id, name, type, lat, lng, municipality, priceCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [barrio, minimercado, supermercado, descuento] }
        address: { type: string, description: Opcional; muchas tiendas no tienen dirección formal. }
        neighborhood:
          type: string
          description: >-
            Opcional (H-06): barrio de la tienda, cuando el directorio lo tiene. Junto con address distingue
            tiendas de la misma cadena. Dato público de la tienda, no del usuario.
        lat: { type: number, description: Latitud de la tienda (nunca la del usuario, RF-005 RN4). }
        lng: { type: number, description: Longitud de la tienda. }
        municipality: { $ref: '#/components/schemas/Municipality' }
        distanceM:
          type: integer
          minimum: 0
          description: Metros desde el punto consultado; solo en GET /establishments/nearby.
        priceCount:
          type: integer
          minimum: 0
          description: >-
            Cuántas presentaciones tienen hoy un precio en la tienda, con el mismo criterio que
            GET /establishments/{establishmentId}/prices con onlyCurrent=true: no cuentan los
            desactualizados ni los que están en revisión; los por confirmar sí cuentan.
            Incluye los precios oficiales y cuenta cada presentación una sola vez (#218).
    Municipality:
      type: string
      description: Municipio del Quindío (#106). Las tiendas de la semilla son de Armenia.
      enum: [armenia, buenavista, calarca, circasia, cordoba, filandia, genova, la-tebaida, montenegro, pijao, quimbaya, salento]
    ComparisonItem:
      type: object
      description: >-
        Un precio por tienda. Si la tienda tiene precio oficial (#204, D1 del grill comercial), sale el
        oficial (source oficial, sin reportId, reliability ni confirmations), salvo que 2 o más
        reportes confiables, recientes, posteriores al último cambio del oficial, del mismo lado y a
        más de 5 % sean más que los que coinciden: entonces entra al orden la mediana de esos reportes
        (source comunidad, con su reportId) y discrepancy trae el oficial al lado.
      required: [establishment, presentationId, priceCop, unitPrice, source, freshness, isCheapest, observedAt]
      properties:
        establishment: { $ref: '#/components/schemas/Establishment' }
        reportId:
          type: string
          format: uuid
          description: >-
            El reporte cuyo precio se muestra; sirve para marcarlo como dudoso (RF-013). No viene en un
            precio oficial (#204).
        presentationId: { type: string, format: uuid }
        priceCop: { type: integer, minimum: 1 }
        unitPrice:
          type: object
          description: >-
            Precio normalizado por 100 g, 100 ml o unidad (RF-004). Se muestra redondeado al
            peso entero con la mitad hacia arriba; el orden de la comparación usa el valor exacto.
          required: [valueCop, per]
          properties:
            valueCop: { type: integer, minimum: 0 }
            per: { type: string, enum: [100g, 100ml, und] }
        source:
          type: string
          enum: [comunidad, oficial, siembra]
          description: >-
            comunidad (reportes), siembra (dato inicial, #135) u oficial (publicado por el comercio
            verificado, #204).
        freshness:
          type: string
          enum: [vigente, por_confirmar, desactualizado]
          description: >-
            Vigencia según el TTL de la categoría (RF-010, ADR-005), con edad = ahora menos la fecha
            de observación: vigente si edad ≤ TTL; por_confirmar si TTL < edad ≤ 2 TTL;
            desactualizado si edad > 2 TTL (no entra al orden de la comparación).
        reliability:
          type: string
          enum: [alta, media, baja, en_revision]
          description: >-
            Confiabilidad del precio al momento de la consulta (score de RF-011, issue #31): alta,
            media o baja. en_revision si el único precio de esa tienda quedó sospechoso (RF-012) y
            espera moderación; no compite en el orden. Un precio sin evaluar cuenta como baja. No viene
            en un precio oficial, que no se califica (#204).
        isCheapest:
          type: boolean
          description: >-
            Verdadero en el precio por unidad más bajo (valor exacto) entre los resultados vigentes y
            por confirmar; si varios empatan, en todos. Un precio desactualizado o en_revision siempre
            es falso.
        confirmations:
          type: integer
          minimum: 0
          description: >-
            Cuántas cuentas distintas confirman el precio (a ±5 %, dentro de su vigencia). No viene en
            un precio oficial (#204).
        observedAt:
          type: string
          format: date-time
          description: Cuándo se vio el precio; en un precio oficial, su última confirmación.
        discrepancy: { $ref: '#/components/schemas/PriceDiscrepancy' }
    PriceDiscrepancy:
      type: object
      additionalProperties: false
      description: >-
        Solo con discrepancia corroborada (D1, ADR-008): el oficial se muestra al lado del precio
        que entra al orden, con aviso.
      required: [officialPriceCop, reportedPriceCop, reports, since]
      properties:
        officialPriceCop: { type: integer }
        reportedPriceCop: { type: integer, description: La mediana de los reportes que corroboran. }
        reports: { type: integer, minimum: 2, description: Cuántos reportes la corroboran. }
        since: { type: string, format: date-time, description: El más antiguo de esos reportes. }
    Promotion:
      type: object
      description: >-
        D6 del grill comercial (#206). Según type: percent (descuento_porcentual, entero de 1 a 90),
        specialPriceCop (precio_especial, menor que el oficial y de al menos $100) o payX y takeY
        (pague_x_lleve_y, takeY mayor que payX).
      additionalProperties: false
      required: [presentationId, type, conditions, validFrom, validUntil]
      properties:
        presentationId: { type: string, format: uuid }
        type: { type: string, enum: [descuento_porcentual, precio_especial, pague_x_lleve_y] }
        percent: { type: integer, minimum: 1, maximum: 90 }
        specialPriceCop: { type: integer, minimum: 100 }
        payX: { type: integer, minimum: 1 }
        takeY: { type: integer, minimum: 2 }
        conditions: { $ref: '#/components/schemas/PromotionConditions' }
        validFrom: { type: string, format: date, description: Fecha de Colombia, incluida. }
        validUntil: { type: string, format: date, description: Fecha de Colombia, incluida. }
    PromotionConditions:
      type: object
      description: Condiciones fijas, sin texto libre (D6).
      additionalProperties: false
      required: [whileStocksLast, paymentMethod]
      properties:
        maxPerCustomer: { type: integer, minimum: 1, maximum: 99 }
        whileStocksLast: { type: boolean }
        paymentMethod: { type: string, enum: [cualquiera, efectivo, tarjeta] }
    MerchantPromotion:
      type: object
      description: Una promoción del comercio con su estado calculado hoy (D6).
      additionalProperties: false
      required: [id, establishmentId, presentationId, type, conditions, validFrom, validUntil, createdAt, status, officialPriceCop, promotedPriceCop]
      properties:
        id: { type: string, format: uuid }
        establishmentId: { type: string, format: uuid }
        presentationId: { type: string, format: uuid }
        type: { type: string, enum: [descuento_porcentual, precio_especial, pague_x_lleve_y] }
        percent: { type: integer }
        specialPriceCop: { type: integer }
        payX: { type: integer }
        takeY: { type: integer }
        conditions: { $ref: '#/components/schemas/PromotionConditions' }
        validFrom: { type: string, format: date }
        validUntil: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        status:
          type: string
          enum: [activa, pausada, vencida, programada]
          description: pausada si el oficial ya no está vigente; reconfirmarlo la reactiva.
        officialPriceCop: { type: [integer, 'null'] }
        promotedPriceCop:
          type: [integer, 'null']
          description: Precio de una unidad con la promoción; en pague X lleve Y, el promedio por unidad.
    ComparisonPromotion:
      type: object
      description: Una promoción activa de una tienda del área, aparte de los resultados (ADR-009).
      additionalProperties: false
      required: [id, establishment, presentationId, type, conditions, validFrom, validUntil, officialPriceCop, promotedPriceCop]
      properties:
        id: { type: string, format: uuid }
        establishment: { $ref: '#/components/schemas/Establishment' }
        presentationId: { type: string, format: uuid }
        type: { type: string, enum: [descuento_porcentual, precio_especial, pague_x_lleve_y] }
        percent: { type: integer }
        specialPriceCop: { type: integer }
        payX: { type: integer }
        takeY: { type: integer }
        conditions: { $ref: '#/components/schemas/PromotionConditions' }
        validFrom: { type: string, format: date }
        validUntil: { type: string, format: date }
        officialPriceCop: { type: integer, description: El «antes», el oficial vigente. }
        promotedPriceCop: { type: integer, description: El precio de una unidad con la promoción. }
    Comparison:
      type: object
      required: [productId, criteria, results, promotions]
      properties:
        productId: { type: string, format: uuid }
        criteria:
          type: object
          description: >-
            Criterios declarados al usuario (EC-06). radiusKm sale si se envió la ubicación;
            municipality, si se filtró por municipio (#106).
          required: [sort]
          properties:
            sort: { type: string, enum: [unit_price, distance, recent] }
            radiusKm: { type: number }
            municipality: { $ref: '#/components/schemas/Municipality' }
        results:
          type: array
          description: >-
            Primero los precios vigentes y por confirmar, ordenados por el criterio declarado; al final
            los desactualizados y los que están en revisión (reliability en_revision), ordenados entre
            sí con el mismo criterio (no compiten con los demás). Con onlyCurrent=true no aparecen.
          items: { $ref: '#/components/schemas/ComparisonItem' }
        promotions:
          type: array
          description: >-
            Siempre separadas del resultado; no alteran el orden (ADR-009). Solo las activas de las
            tiendas del área (#206).
          items: { $ref: '#/components/schemas/ComparisonPromotion' }
        wholesaleReference:
          type: object
          description: >-
            Opcional. Precio mayorista por kilo publicado por SIPSA (DANE), cargado a mano por el equipo
            (RF-014, ADR-011). Es una referencia pública: nunca es precio de una tienda, no entra al orden
            ni a isCheapest. Solo para productos que se venden por peso, y solo si su periodo terminó hace
            30 días o menos (#34).
          required: [source, productName, market, pricePerKgCop, periodStart, periodEnd, url]
          properties:
            source: { type: string, enum: ['SIPSA (DANE)'] }
            productName: { type: string, description: Nombre del producto en el boletín SIPSA. }
            market: { type: string, example: 'Armenia, Mercar' }
            pricePerKgCop: { type: integer, minimum: 1 }
            periodStart: { type: string, format: date }
            periodEnd: { type: string, format: date }
            url: { type: string, format: uri, description: Boletín de donde salió el dato. }
        savingsPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Cuánto menos cuesta el precio más bajo que el más alto, por precio por unidad, entre los
            resultados que pueden ser el más barato (los mismos de isCheapest: ni desactualizados ni en
            revisión): (más caro − más barato) / más caro × 100, con los valores exactos y redondeado al
            entero con la mitad hacia arriba (B#128, EC-06). Solo sale con dos tiendas o más.
    FeaturedPrice:
      type: object
      description: Un precio vigente de la canasta básica de hoy, con la tienda donde está (B#128).
      required: [presentationId, label, priceCop, source, unitPrice, establishment]
      properties:
        presentationId: { type: string, format: uuid }
        label:
          type: string
          example: Arroz Diana · 500 g
          description: Producto y presentación, como label del historial.
        priceCop: { type: integer, minimum: 1 }
        source: { type: string, enum: [comunidad, oficial, siembra] }
        discrepancy: { $ref: '#/components/schemas/PriceDiscrepancy' }
        unitPrice:
          type: object
          description: Redondeado al peso entero con la mitad hacia arriba (RF-004).
          required: [valueCop, per]
          properties:
            valueCop: { type: integer, minimum: 0 }
            per: { type: string, enum: [100g, 100ml, und] }
        establishment:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            address: { type: string, description: Opcional; dirección de la tienda cuando el directorio la tiene (H-06). }
            neighborhood: { type: string, description: Opcional; barrio de la tienda cuando el directorio lo tiene (H-06). }
            distanceM:
              type: integer
              minimum: 0
              description: Metros desde la ubicación consultada; solo si se envió la ubicación.
    ReportCreate:
      type: object
      required: [presentationId, establishmentId, priceCop, observedAt]
      properties:
        presentationId: { type: string, format: uuid }
        establishmentId: { type: string, format: uuid }
        priceCop:
          type: integer
          minimum: 1
          maximum: 10000000
          description: >-
            Precio total en pesos. Menos de $100 o más de $5.000.000 se rechaza con 422
            IMPLAUSIBLE_PRICE (ADR-030, valores provisionales).
        priceType:
          type: string
          enum: [normal, oferta]
          default: normal
          description: combo queda fuera hasta definir qué significa (grill de la #14, pregunta 8).
        observedAt:
          type: string
          format: date-time
          description: >-
            Hora real de observación en la tienda; puede ser anterior si estuvo en la cola sin conexión.
            No puede estar más de 5 minutos en el futuro; el máximo de 24 h de antigüedad llega con la issue #29.
    ReportReceipt:
      type: object
      required: [id, status, receivedAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [recibido, en_revision, vigente, descartado]
          description: >-
            Hoy siempre recibido: el veredicto llega después (ADR-004). Un precio atípico (ADR-030)
            aparece como en_revision en GET /me/reports.
        receivedAt: { type: string, format: date-time }
    ModerationItem:
      type: object
      description: Nunca incluye quién reportó ni quién marcó (EC-08).
      required: [id, reason, productName, establishmentName, reportedPriceCop, reportersCount, createdAt]
      properties:
        id: { type: string, format: uuid, description: Id del reporte. }
        reason: { type: string, enum: [apelacion, desviacion, rafaga, marcado, discrepancia_oficial, verificacion_comercio] }
        productName: { type: string, description: 'Producto y presentación, por ejemplo «Arroz Diana · 500 g».' }
        establishmentName: { type: string }
        reportedPriceCop: { type: integer }
        medianPriceCop: { type: integer, description: Mediana de referencia; no está si no había con qué comparar. }
        officialPriceCop: { type: integer }
        deviationPercent: { type: number, description: Desviación frente a la mediana, en porcentaje entero. }
        reportersCount: { type: integer, minimum: 0, description: Cuántas cuentas lo marcaron como dudoso. }
        createdAt: { type: string, format: date-time }
        appealNote:
          type: string
          description: Solo en las apelaciones; el motivo del autor, sin decir quién descartó (#71).
