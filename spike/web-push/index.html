<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Spike de avisos</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 1rem auto; padding: 0 1rem; line-height: 1.4; }
      button, input { font: inherit; padding: 0.6rem 0.9rem; margin: 0.25rem 0; }
      button { display: block; width: 100%; }
      pre { background: #f3f3f3; padding: 0.75rem; overflow: auto; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Spike de avisos (#256)</h1>
    <p id="env"></p>
    <button id="enable" type="button">1. Activar avisos</button>
    <label>Código del servidor <input id="token" autocomplete="off" /></label>
    <button id="send" type="button">2. Enviar aviso de prueba (cierra la app y espera)</button>
    <pre id="log">Listo.</pre>
    <script>
      const log = (m) => (document.getElementById('log').textContent = `${new Date().toLocaleTimeString()} ${m}\n` + document.getElementById('log').textContent);
      const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      const ios = /iphone|ipad/i.test(navigator.userAgent);
      document.getElementById('env').textContent =
        `Permiso: ${'Notification' in window ? Notification.permission : 'sin soporte'} · PWA instalada: ${standalone ? 'sí' : 'no'}` +
        (ios && !standalone ? ' · En iPhone instala la app: Compartir → Agregar a pantalla de inicio.' : '');

      const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(s.length / 4) * 4, '=')), (c) => c.charCodeAt(0));

      document.getElementById('enable').onclick = async () => {
        try {
          if (!('serviceWorker' in navigator) || !('PushManager' in window)) return log('Este navegador no soporta Web Push.');
          const reg = await navigator.serviceWorker.register('/sw.js');
          await navigator.serviceWorker.ready;
          // El permiso se pide al tocar el botón, nunca al cargar la página.
          const permission = await Notification.requestPermission();
          if (permission !== 'granted') return log(`Permiso: ${permission}`);
          const { publicKey } = await (await fetch('/vapid')).json();
          const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(publicKey) });
          const r = await fetch('/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sub) });
          log(`Suscrito (${r.status}). Servicio de push: ${new URL(sub.endpoint).host}`);
        } catch (error) {
          log(`Error: ${error.message}`);
        }
      };

      document.getElementById('send').onclick = async () => {
        const r = await fetch('/send', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-token': document.getElementById('token').value }, body: JSON.stringify({ title: 'Valora', text: '3 casos pendientes en moderación' }) });
        log(`Envío: ${r.status} ${await r.text()}`);
      };
    </script>
  </body>
</html>
