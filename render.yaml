# Infraestructura del backend en Render (ADR-012, RNF-009 RN1). Los secretos no van aquí (RN2):
# las variables con sync: false se llenan en el panel de Render al crear el servicio.
services:
  - type: web
    name: valora-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: virginia
    branch: main
    # Una sola copia: el outbox corre dentro del proceso (ADR-015).
    numInstances: 1
    healthCheckPath: /v1/health
    # Despliega el pipeline después de aplicar las migraciones, no cada commit.
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      # Saltos de proxy delante de la API (ADR-012): Vercel y Render. Con 2, request.ip es la IP real
      # del cliente y los límites por IP (#16) no agrupan a todos. Verificar tras el primer despliegue
      # (docs/despliegue.md, paso 8).
      - key: TRUST_PROXY
        value: '2'
      # Cadena de conexión de Neon.
      - key: DATABASE_URL
        sync: false
      # La validación de la configuración la exige aunque en producción no se usa.
      - key: DATABASE_URL_TEST
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # No debe cambiar una vez en uso: las reputaciones quedan asociadas a esta clave (#31).
      - key: REPORTER_KEY_SECRET
        sync: false
      - key: OUTBOX_POLL_INTERVAL_MS
        value: '5000'
      - key: OUTBOX_MAX_ATTEMPTS
        value: '5'
      - key: MEDIA_DIR
        value: media
      # Dirección pública de las fotos en el disco local (ADR-020). Con Supabase (ADR-022) no se usa,
      # pero la validación de la configuración la exige.
      - key: MEDIA_PUBLIC_URL
        sync: false
      # Fotos que sube el moderador: bucket público de Supabase Storage (ADR-022). El disco de Render
      # se borra en cada despliegue, por eso no se usa en producción.
      - key: SUPABASE_URL
        sync: false
      # Clave secreta del servidor (sb_secret_...): solo en el panel de Render, nunca en Git (RN2).
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: productos
      # Correo de verificación (ADR-029). Con EMAIL_PROVIDER=resend las otras tres son obligatorias; con
      # «console» (por defecto) no se entrega ningún correo. La clave nunca va en Git.
      # Mientras no haya proveedor de correo, false: con «console» nadie recibe el enlace y se bloquearían
      # todos los reportes (la API ni arranca en producción con true y console). Se cambia a true al
      # configurar EMAIL_PROVIDER=resend, EMAIL_API_KEY, EMAIL_FROM y APP_URL.
      - key: REQUIRE_VERIFIED_EMAIL
        value: 'false'
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Dirección pública de la PWA (https://...), sin barra final: base del enlace /verificar-correo.
      - key: APP_URL
        sync: false
